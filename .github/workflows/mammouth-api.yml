name: Mammouth API Proxy

on:
  repository_dispatch:
    types: [parse-meal]
  workflow_dispatch:

jobs:
  parse-meal:
    runs-on: ubuntu-latest
    steps:
      - name: Parse meal with Mammouth AI
        id: parse
        env:
          MAMMOUTH_API_KEY: ${{ secrets.MAMMOUTH_API_KEY }}
        run: |
          # Récupérer les données envoyées
          MEAL_DESCRIPTION="${{ github.event.client_payload.description }}"
          USER_ID="${{ github.event.client_payload.user_id }}"
          
          # Appeler Mammouth API
          RESPONSE=$(curl -s -X POST https://api.mammouth.ai/v1/messages \
            -H "Authorization: Bearer $MAMMOUTH_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{
              \"model\": \"gpt-4-mini\",
              \"messages\": [
                {
                  \"role\": \"user\",
                  \"content\": \"Parse ce repas et retourne UNIQUEMENT un JSON valide:\n$MEAL_DESCRIPTION\n\nRéponds UNIQUEMENT avec ce format JSON (pas de texte avant/après):\n{\\\"name\\\": \\\"nom du repas\\\", \\\"calories\\\": nombre, \\\"proteins\\\": nombre, \\\"carbs\\\": nombre, \\\"fats\\\": nombre, \\\"quantity\\\": \\\"quantité estimée\\\", \\\"confidence\\\": 0-100}\"
                }
              ]
            }")
          
          # Extraire la réponse
          PARSED=$(echo "$RESPONSE" | jq -r '.content.choices[0].message.content' 2>/dev/null || echo '{"error": "API Error"}')
          
          # Encoder en base64 pour éviter les problèmes de caractères spéciaux
          ENCODED=$(echo "$PARSED" | base64 -w 0)
          echo "result=$ENCODED" >> $GITHUB_OUTPUT
      
      - name: Create workflow dispatch event
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const result = '${{ steps.parse.outputs.result }}';
            
            // Sauvegarder le résultat dans un artifact pour le frontend
            fs.writeFileSync('/tmp/meal-result.json', result);
      
      - name: Upload result as artifact
        uses: actions/upload-artifact@v3
        with:
          name: meal-parse-result
          path: /tmp/meal-result.json
          retention-days: 1
