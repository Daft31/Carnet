name: API Call with Mammouth

on:
  workflow_run:
    workflows: ["Deploy to Vercel"]
    types:
      - completed

jobs:
  call-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Call Mammouth API
        env:
          CARNET_API_KEY: ${{ secrets.CARNET_API_KEY }}
        run: |
          curl -X POST https://api.mammouthai.com/v1/process \
            -H "Authorization: Bearer $CARNET_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{
              "action": "process_deployment",
              "repository": "${{ github.repository }}",
              "commit": "${{ github.sha }}"
            }'
