name: Mammouth API Integration

on:
  push:
    paths:
      - 'api/parse-meal.js'
      - '.github/workflows/mammouth-api.yml'
  workflow_dispatch:

jobs:
  test-mammouth-api:
    runs-on: ubuntu-latest
    environment: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Test Mammouth API integration
        env:
          CARNET_API_KEY: ${{ secrets.CARNET_API_KEY }}
        run: |
          # Test que la clé API est accessible
          if [ -z "$CARNET_API_KEY" ]; then
            echo "❌ CARNET_API_KEY n'est pas définie"
            exit 1
          fi
          echo "✅ CARNET_API_KEY est définie"
          
          # Ici tu peux ajouter des tests plus complets
          node -e "
            const key = process.env.CARNET_API_KEY;
            console.log('API Key length:', key.length);
            console.log('Key starts with sk-:', key.startsWith('sk-'));
          "

      - name: Deploy to Vercel (optional)
        if: success()
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npm install -g vercel
          vercel --prod --token $VERCEL_TOKEN
