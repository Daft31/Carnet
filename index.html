<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Carnet</title>
<link rel="icon" href="data:,">
<style>
  :root{
    --paper:#F1F5F0;
    --surface:#FFFFFF;
    --surface-2:#E7EEE5;
    --ink:#1C2B22;
    --ink-soft:#5B6B5E;
    --ink-faint:#93A395;
    --blue:#3A62D8;
    --blue-soft:#E4E9FC;
    --rust:#E4602F;
    --rust-soft:#FCE3D6;
    --green:#1E8F63;
    --green-soft:#DEF2E7;
    --amber:#D99A2B;
    --accent-neutral:#6E7F72;
    --accent-neutral-soft:#E8EEE8;
    --journal-paper:#FBF8F1;
    --line:#E6E9E3;
    --radius:16px;
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Consolas, monospace;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:var(--font-sans);
    background:var(--paper);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  #app{max-width:520px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; background:transparent;}

  header.top{
    display:flex; justify-content:space-between; align-items:center;
    padding:12px 18px; border-bottom:1px solid var(--line);
    background:var(--surface); position:sticky; top:0; z-index:40;
    box-shadow:0 1px 3px rgba(28,43,34,.06);
  }
  .brand{
    font-size:15px; font-weight:700; letter-spacing:-0.01em;
  }
  .brand small{
    display:block; font-size:11px; font-weight:500; color:var(--ink-soft); margin-top:2px;
  }
  .theme-toggle{
    background:var(--surface-2); border:none; border-radius:10px; width:36px; height:36px;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    color:var(--ink); transition:background .2s ease;
  }
  .theme-toggle:active{background:var(--blue-soft); color:var(--blue);}
  .theme-toggle svg{width:20px; height:20px;}

  nav.tabs{
    display:flex; gap:2px; overflow-x:auto; padding:8px; background:var(--surface);
    border-top:1px solid var(--line); position:sticky; bottom:0; z-index:30;
    scroll-behavior:smooth; -webkit-overflow-scrolling:touch;
  }
  nav.tabs button{
    flex-shrink:0; display:flex; flex-direction:column; align-items:center; gap:4px;
    background:transparent; border:none; color:var(--ink-faint); cursor:pointer;
    padding:6px 10px; border-radius:10px; font-size:11px; font-weight:600;
    transition:background .2s ease, color .2s ease;
  }
  nav.tabs button:active{background:var(--surface-2);}
  nav.tabs button.active{color:var(--green); background:var(--green-soft);}
  nav.tabs button svg{width:20px; height:20px;}

  section.card{
    background:var(--surface); border:none; border-radius:20px;
    padding:18px; margin-bottom:16px;
    box-shadow:0 1px 3px rgba(28,43,34,.06), 0 8px 24px rgba(28,43,34,.04);
  }
  .card h2{margin:0 0 12px; font-size:12.5px; font-weight:700; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em;}

  .hero-remaining{text-align:left; margin-bottom:6px;}
  .hero-remaining .num{font-family:var(--font-mono); font-size:46px; font-weight:700; line-height:1; letter-spacing:-0.02em; color:var(--green);}
  .hero-remaining .num.neg{color:var(--rust);}
  .hero-remaining .unit{font-family:var(--font-mono); font-size:16px; color:var(--ink-soft); margin-left:6px;}
  .hero-remaining .desc{font-size:13px; color:var(--ink-soft); margin-top:4px;}

  .bar{height:9px; border-radius:6px; background:var(--surface-2); overflow:hidden; margin-top:12px;}
  .bar > div{height:100%; background:var(--green); border-radius:6px; transition:width .25s ease;}
  .bar.over > div{background:var(--rust);}

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    background:var(--green); color:#fff; border:none; border-radius:12px;
    font-family:var(--font-sans); font-size:14px; font-weight:700; padding:13px 16px;
    cursor:pointer; width:100%; margin-top:14px;
  }
  .btn:active{opacity:.85;}
  .btn.secondary{background:var(--blue-soft); color:var(--blue); border:none;}
  .btn.ghost{background:var(--surface-2); color:var(--ink-soft); border:none;}
  .btn.rust{background:var(--rust);}
  .btn.small{width:auto; padding:8px 12px; font-size:13px; margin-top:0;}

  .search-results{margin-top:10px; max-height:260px; overflow-y:auto; border-top:1px solid var(--line);}
  .food-row{
    display:flex; justify-content:space-between; align-items:center;
    padding:10px 2px; border-bottom:1px solid var(--line); cursor:pointer;
  }
  .food-row:active{background:var(--green-soft);}
  .food-row .fn{font-size:14px; font-weight:600;}
  .food-row .fm{font-size:11px; color:var(--ink-faint); font-family:var(--font-mono);}
  .food-row button.edit{background:var(--surface-2); border:none; border-radius:8px; color:var(--ink-soft); font-size:13px; padding:5px 9px; margin-left:8px; cursor:pointer; flex-shrink:0;}
  .food-row button.edit:active{background:var(--blue-soft); color:var(--blue);}
  .food-row button.star{background:none; border:none; color:var(--ink-faint); font-size:19px; padding:2px 4px; margin-left:6px; cursor:pointer; flex-shrink:0; line-height:1;}
  .food-row button.star.active{color:var(--amber);}

  input, textarea, select{
    width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:12px;
    font-family:var(--font-sans); font-size:14px; color:var(--ink); background:var(--surface);
    transition:border-color .2s ease, background .35s ease;
  }
  input:focus, textarea:focus, select:focus{outline:none; border-color:var(--green);}
  textarea{resize:vertical; min-height:100px; font-family:var(--font-mono); font-size:13px; line-height:1.6;}
  .journal-textarea{
    background-image:linear-gradient(rgba(28,43,34,.04) 1px, transparent 1px), repeating-linear-gradient(to bottom, transparent 0, transparent 27px, #E6E9E3 27px, #E6E9E3 28px);
    background-size:100% 1px, 100% 28px;
    background-position:0 0, 0 0;
    padding-left:60px;
  }

  label{display:block; font-size:12px; font-weight:700; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em; margin:14px 0 6px;}

  .modal-bg{
    position:fixed; inset:0; background:rgba(20,30,23,.5); display:flex; align-items:flex-end;
    z-index:50;
  }
  .modal{
    background:var(--paper); width:100%; max-width:520px; margin:0 auto;
    border-radius:20px 20px 0 0; padding:20px 18px calc(20px + env(safe-area-inset-bottom));
    max-height:85vh; overflow-y:auto;
  }
  .modal h3{margin:0 0 4px; font-size:16px;}
  .modal .close{position:absolute; top:14px; right:16px; background:none; border:none; font-size:20px; color:var(--ink-soft);}
  .modal-wrap{position:relative;}

  .qty-preview{display:flex; gap:14px; margin-top:14px; padding:12px; background:var(--surface); border:none; border-radius:12px; box-shadow:0 1px 2px rgba(28,43,34,.05), 0 4px 14px rgba(28,43,34,.04);}
  .qty-preview .item{flex:1; text-align:center;}
  .qty-preview .item .n{font-family:var(--font-mono); font-weight:700; font-size:15px;}
  .qty-preview .item .l{font-size:10px; color:var(--ink-faint); margin-top:2px;}

  .toast{
    position:fixed; bottom:78px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:var(--surface); padding:9px 16px; border-radius:20px;
    font-size:13px; z-index:80; opacity:0; pointer-events:none; transition:opacity .2s ease;
  }
  .toast.show{opacity:1;}

  .empty{
    text-align:center; padding:40px 20px; color:var(--ink-faint); font-size:14px; line-height:1.6;
  }

  h1.page-title{font-size:19px; margin:2px 0 14px; letter-spacing:-0.01em;}
  .hint{font-size:12px; color:var(--ink-faint); margin-top:6px; line-height:1.4;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}

  /* --- Onglet To-do : objectifs et habitudes quotidiennes --- */
  .todo-intro{background:linear-gradient(135deg,#193c2d 0%,#245843 100%);color:#fff;position:relative;overflow:hidden;}
  .todo-intro::after{content:"✓";position:absolute;right:18px;top:8px;font-size:76px;font-weight:800;color:rgba(255,255,255,.09);transform:rotate(-10deg);}
  .todo-intro h2,.todo-intro p{position:relative;z-index:1}
  .todo-intro p{color:#c7e4d1;margin:5px 0 0;font-size:12px;line-height:1.45;max-width:330px}

  .todo-form{display:grid;grid-template-columns:1fr auto;gap:9px;align-items:center;margin-top:12px}
  .todo-form input{min-width:0}
  .todo-form .btn{padding-left:14px;padding-right:14px}
  .todo-options{grid-column:1 / -1;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-soft)}
  .todo-options input{accent-color:var(--green);width:16px;height:16px}

  .todo-list{display:flex;flex-direction:column;gap:8px;margin-top:2px}
  .todo-item{display:flex;align-items:center;gap:10px;padding:11px 10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 1px 2px rgba(28,43,34,.04)}
  .todo-item.done{background:var(--surface-2)}
  .todo-item.done .todo-label{text-decoration:line-through;color:var(--ink-faint)}
  .todo-check{
    appearance:none; -webkit-appearance:none; width:21px; height:21px; flex:0 0 21px;
    border:1.5px solid var(--ink-faint); border-radius:7px; background:var(--surface);
    cursor:pointer; display:grid; place-content:center; transition:all .15s ease;
  }
  .todo-check:checked{background:var(--green); border-color:var(--green); color:#fff;}
  .todo-check:checked::after{content:"✓"; font-size:12px; color:#fff; line-height:1;}
  .todo-label{flex:1; font-size:14px; cursor:pointer;}

  /* --- Onglet Poids : entrée et historique --- */
  .weight-input-row{display:grid; grid-template-columns:1fr auto; gap:10px; align-items:flex-end; margin-bottom:14px;}
  .weight-input-row input{margin:0;}
  .weight-input-row .btn{margin:0;}

  .weight-history{display:flex; flex-direction:column; gap:8px; margin-top:8px;}
  .weight-entry{
    display:flex; justify-content:space-between; align-items:center; padding:10px; background:var(--surface-2);
    border-radius:10px; font-size:14px;
  }
  .weight-entry .w{font-family:var(--font-mono); font-weight:700;}
  .weight-entry .d{font-size:12px; color:var(--ink-faint);}

  /* --- Onglet Historique : statistiques sur 7 jours --- */
  .weekly-deficit{
    background:linear-gradient(135deg,#f3f9f6 0%,#e8f3ed 100%);
    border-radius:16px; padding:18px; margin-bottom:16px; text-align:center;
  }
  .weekly-deficit.past{background:var(--surface);}
  .weekly-deficit h3{margin:0 0 4px; font-size:14px; font-weight:600; color:var(--ink-soft);}
  .weekly-deficit .big{font-family:var(--font-mono); font-size:36px; font-weight:700; line-height:1; margin:8px 0;}
  .weekly-deficit .sub{font-size:12px; color:var(--ink-faint);}

  .chart-bars{
    display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-top:14px; height:120px; align-items:flex-end;
  }
  .hist-day{
    background:var(--surface-2); border-radius:8px; cursor:pointer;
    display:flex; flex-direction:column; justify-content:flex-end; align-items:center; gap:4px;
    padding:6px 2px; min-height:100%; transition:background .15s ease;
    position:relative;
  }
  .hist-day:active{background:var(--blue-soft);}
  .hist-day .bar{height:var(--h,0%); width:100%; background:var(--green); border-radius:4px 4px 0 0; transition:height .2s ease;}
  .hist-day.over .bar{background:var(--rust);}
  .hist-day .d{font-size:9px; color:var(--ink-faint); font-weight:600; white-space:nowrap;}

  /* --- Workout section cards --- */
  .wk-cards{ display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-top:6px; }
  .wk-card{
    background:var(--surface); border:1.5px solid var(--line); border-radius:14px;
    padding:14px 12px; cursor:pointer; display:flex; flex-direction:column; gap:8px;
    transition:transform .15s ease, border-color .15s ease, background .2s ease;
    min-height:96px; text-align:left; font-family:inherit; color:inherit;
  }
  .wk-card:active{ transform:scale(.97); }
  .wk-card.active{ border-color:var(--green); background:var(--green-soft); }
  .wk-card .ico{ width:34px; height:34px; display:grid; place-content:center; border-radius:10px; background:var(--surface-2); color:var(--green); }
  .wk-card .ico svg{ width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:1.7; }
  .wk-card.active .ico{ background:var(--green); color:#fff; }
  .wk-card .lbl{ font-size:13.5px; font-weight:700; }
  .wk-card .hint{ font-size:11px; color:var(--ink-faint); }

  /* --- Smooth color transitions for theme switching --- */
  body, body * { transition-property: background-color, color, border-color, fill, stroke; transition-duration: .35s; transition-timing-function: ease; }

  /* ---- Dark theme: duplicated palette under body.dark ---- */
  body.dark{
    --paper:#0E1411;
    --surface:#171F1B;
    --surface-2:#222C26;
    --ink:#E8F1EA;
    --ink-soft:#9CB3A1;
    --ink-faint:#6D8473;
    --blue:#7A98F2;
    --blue-soft:#1F2A4A;
    --rust:#F0875A;
    --rust-soft:#3A1F18;
    --green:#46C18C;
    --green-soft:#163527;
    --amber:#E8B85A;
    --accent-neutral:#8C9D90;
    --accent-neutral-soft:#243027;
    --journal-paper:#14201B;
    --line:#28332C;
  }
  body.dark #app{background:transparent;}
  body.dark section.card{background:var(--surface); box-shadow:0 1px 3px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);}
  body.dark nav.tabs{background:rgba(23,31,27,.94);}
  body.dark input, body.dark textarea, body.dark select{background:var(--surface-2); color:var(--ink);}
  body.dark .journal-textarea{background-image:linear-gradient(rgba(180,165,135,.05) 1px, transparent 1px), repeating-linear-gradient(to bottom, transparent 0, transparent 27px, #243027 27px, #243027 28px);}
  body.dark .weekly-deficit{background:linear-gradient(135deg,#0F2620 0%,#1B4336 100%);}
  body.dark .weekly-deficit.past{background:var(--surface);}
  body.dark .hist-day{background:var(--surface);}
  body.dark .todo-item{background:var(--surface);}
  body.dark .todo-intro{background:linear-gradient(135deg,#0F2620 0%,#1B4336 100%);}
  body.dark .seg button:not(.active){background:var(--surface-2); color:var(--ink-soft);}

  .seg{
    display:flex; gap:8px; margin-bottom:14px;
  }
  .seg button{
    flex:1; padding:10px 12px; border:1.5px solid var(--line); border-radius:10px;
    background:var(--surface); color:var(--ink-soft); font-size:13px; font-weight:600;
    cursor:pointer; transition:all .15s ease;
  }
  .seg button.active{
    border-color:var(--green); background:var(--green-soft); color:var(--green);
  }
  .seg button:active{transform:scale(.95);}

  .kcal-ring-wrap{
    display:flex; gap:16px; align-items:center; margin-bottom:20px;
  }
  .kcal-ring{
    width:120px; height:120px; color:var(--green); flex-shrink:0;
  }
  .kcal-ring.over{color:var(--rust);}
  .kcal-ring .track{stroke:var(--surface-2);}
  .kcal-ring .fill{stroke:currentColor;}

  .kcal-summary{flex:1;}
  .kcal-summary .big{font-family:var(--font-mono); font-size:28px; font-weight:700; line-height:1; margin-bottom:4px;}
  .kcal-summary .big.neg{color:var(--rust);}
  .kcal-summary .sub{font-size:12px; color:var(--ink-soft); line-height:1.4; margin-bottom:8px;}
  .kcal-summary .pill{
    display:inline-block; background:var(--surface-2); padding:5px 10px; border-radius:10px;
    font-size:11px; font-weight:600; color:var(--ink-soft);
  }

  .trio{
    display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px;
  }
  .trio .cell{
    background:var(--surface-2); border-radius:12px; padding:12px; text-align:center;
  }
  .trio .cell.blue{background:var(--blue-soft);}
  .trio .cell.rust{background:var(--rust-soft);}
  .trio .cell.green{background:var(--green-soft);}
  .trio .cell .k{font-size:10px; color:var(--ink-faint); text-transform:uppercase; font-weight:600; letter-spacing:.02em; margin-bottom:4px;}
  .trio .cell .v{font-family:var(--font-mono); font-size:16px; font-weight:700; color:var(--ink);}
  .trio .cell.blue .v{color:var(--blue);}
  .trio .cell.rust .v{color:var(--rust);}
  .trio .cell.green .v{color:var(--green);}

  .dayBar{
    display:flex; gap:3px; margin-bottom:14px; height:32px;
  }
  .dayBar button{
    flex:1; border:none; background:var(--surface-2); border-radius:8px; color:var(--ink-faint);
    font-size:10px; font-weight:600; cursor:pointer; transition:all .15s ease;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  }
  .dayBar button.active{background:var(--green); color:#fff;}
  .dayBar button:active{transform:scale(.95);}

  .food-list{display:flex; flex-direction:column; gap:8px; margin-top:12px;}
  .food-entry{
    display:flex; justify-content:space-between; align-items:center; padding:10px 12px;
    background:var(--surface-2); border-radius:10px; font-size:13px;
  }
  .food-entry .fn{font-weight:600;}
  .food-entry .fm{font-size:11px; color:var(--ink-faint); font-family:var(--font-mono);}
  .food-entry .actions{display:flex; gap:6px;}
  .food-entry button{background:none; border:none; color:var(--ink-faint); cursor:pointer; font-size:14px;}
  .food-entry button:active{color:var(--ink);}

  .workout-list{display:flex; flex-direction:column; gap:8px; margin-top:12px;}
  .workout-entry{
    display:flex; justify-content:space-between; align-items:center; padding:12px;
    background:var(--surface-2); border-radius:10px; font-size:13px;
  }
  .workout-entry .wn{font-weight:600;}
  .workout-entry .wm{font-size:11px; color:var(--ink-faint);}
  .workout-entry .actions{display:flex; gap:6px;}
  .workout-entry button{background:none; border:none; color:var(--ink-faint); cursor:pointer; font-size:14px;}
  .workout-entry button:active{color:var(--ink);}

  main#main{flex:1; overflow-y:auto; padding:16px 12px 16px 12px; -webkit-overflow-scrolling:touch;}
  main#main > *:last-child{margin-bottom:24px;}

  .bento{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px;}
  .bento-item{background:var(--surface); border-radius:14px; padding:14px; display:flex; flex-direction:column;}
  .bento-item.full{grid-column:1 / -1;}
  .bento-item .k{font-size:11px; font-weight:600; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.02em; margin-bottom:6px;}
  .bento-item .v{font-family:var(--font-mono); font-size:20px; font-weight:700; color:var(--ink);}
  .bento-item.blue .v{color:var(--blue);}
  .bento-item.rust .v{color:var(--rust);}
  .bento-item.green .v{color:var(--green);}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand">Carnet<small>suivi sport &amp; nutrition</small></div>
    <button class="theme-toggle" id="themeToggle" aria-label="Basculer le mode sombre" title="Mode sombre"><svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg></button>
  </header>
  <main id="main"></main>
  <nav class="tabs" id="tabs">
    <button data-tab="today" title="Aujourd'hui"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>Aujourd'hui</button>
    <button data-tab="meals" title="Repas"><svg viewBox="0 0 24 24"><path d="M6 3v8a2 2 0 002 2h0a2 2 0 002-2V3M6 3v18M10 3v5M18 3c-2 0-3 2-3 5s1 4 3 4v9"/></svg>Repas</button>
    <button data-tab="workouts" title="Séances"><svg viewBox="0 0 24 24"><path d="M4 12h3M17 12h3M7 12a2 2 0 002-2V8a2 2 0 00-2-2 2 2 0 00-2 2v8a2 2 0 002 2 2 2 0 002-2v-2M17 12a2 2 0 01-2-2V8a2 2 0 012-2 2 2 0 012 2v8a2 2 0 01-2 2 2 2 0 01-2-2v-2"/></svg>Séances</button>
    <button data-tab="weight" title="Poids"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M9 5l1-2h4l1 2M12 13l2.5-3"/></svg>Poids</button>
    <button data-tab="history" title="Historique"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 109-9 9.75 9.75 0 00-7 3L3 8"/><path d="M3 4v4h4M12 7v5l3 2"/></svg>Historique</button>
    <button data-tab="notes" title="Notes"><svg viewBox="0 0 24 24"><path d="M6 4h9l4 4v12a1 1 0 01-1 1H6a1 1 0 01-1-1V5a1 1 0 011-1z"/><path d="M14 4v4h4M8 12h8M8 16h5"/></svg>Notes</button>
    <button data-tab="todos" title="To-do"><svg viewBox="0 0 24 24"><path d="M5 5h14v14H5z"/><path d="m8 12 2.2 2.2L16 8.5"/></svg>To-do</button>
    <button data-tab="settings" title="Réglages"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.6a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>Réglages</button>
  </nav>
</div>
<div id="toast" class="toast"></div>
<div id="modal-root"></div>

<script>
/* ===================== LOCAL STORAGE ===================== */
const LS={
  get:(k,d)=>{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; },
  set:(k,v)=>{ localStorage.setItem(k,JSON.stringify(v)); }
};

/* ===================== STATE ===================== */
const state={
  currentTab:'today',
  meals:[],
  workouts:[],
  weights:[],
  notes:'',
  todos:[],
  settings:{ calorieGoal:2500, waterGoal:2000 },
  profile:{ sex:'H', age:30, height:180, activity:'modere' }
};

function loadState(){
  Object.assign(state,LS.get('ct_state',{}));
}
function saveState(){
  LS.set('ct_state',state);
}
loadState();

/* ===================== RENDERING ===================== */
function render(){
  const { currentTab } = state;
  const html = currentTab==='today' ? renderToday()
    : currentTab==='meals' ? renderMeals()
    : currentTab==='workouts' ? renderWorkouts()
    : currentTab==='weight' ? renderWeight()
    : currentTab==='history' ? renderHistory()
    : currentTab==='notes' ? renderNotes()
    : currentTab==='todos' ? renderTodos()
    : currentTab==='settings' ? renderSettings()
    : '';

  document.getElementById('main').innerHTML=html;
  document.querySelectorAll('nav.tabs button').forEach(b=>{
    b.classList.toggle('active',b.dataset.tab===currentTab);
  });

  attachEventListeners();
}

function attachEventListeners(){
  document.querySelectorAll('[data-tab]').forEach(b=>{
    b.addEventListener('click',()=>{
      state.currentTab=b.dataset.tab;
      render();
    });
  });

  if(state.currentTab==='meals'){
    document.getElementById('foodSearch')?.addEventListener('input',updateSearchResults);
  }
}

function renderToday(){
  const meals = state.meals || [];
  const workouts = state.workouts || [];
  const totalKcalIn = meals.reduce((s,m)=>s+(m.kcal||0),0);
  const totalKcalOut = workouts.reduce((s,w)=>s+(w.kcal||0),0);
  const net = totalKcalIn - totalKcalOut;
  const goal = state.settings.calorieGoal || 2500;
  const remaining = goal - net;
  const over = remaining < 0;
  const pctRaw = net / goal;

  const summaryText = over ? 'Surplus calorique' : 'Calories restantes';

  return `
  <section class="card">
    <div class="kcal-ring-wrap">
      <svg class="kcal-ring ${over?'over':''}" viewBox="0 0 120 120">
        <circle class="track" cx="60" cy="60" r="50" fill="none" stroke-width="10"/>
        <circle class="fill" cx="60" cy="60" r="50" fill="none" stroke-width="10" stroke-linecap="round"
          transform="rotate(-90 60 60)"
          stroke-dasharray="${(2*Math.PI*50).toFixed(1)}"
          stroke-dashoffset="${(2*Math.PI*50*(1-Math.min(pctRaw,1))).toFixed(1)}"/>
        <text x="60" y="56" text-anchor="middle" font-size="26" fill="currentColor">${Math.round(net)}</text>
        <text x="60" y="72" text-anchor="middle" font-size="10" fill="var(--ink-faint)">/ ${goal} kcal</text>
      </svg>
      <div class="kcal-summary">
        <div class="big ${remaining<0?'neg':''}">${over?'+'+Math.round(-remaining):Math.round(remaining)} <span style="font-size:13px;color:var(--ink-soft);font-family:var(--font-sans);font-weight:600;">kcal</span></div>
        <div class="sub">${summaryText}</div>
        <span class="pill">${Math.round(pctRaw*100)}% de l'objectif</span>
      </div>
    </div>
    <div class="trio">
      <div class="cell blue"><div class="k">Repas</div><div class="v">${Math.round(totalKcalIn)}</div></div>
      <div class="cell rust"><div class="k">Brûlées</div><div class="v">${Math.round(totalKcalOut)}</div></div>
      <div class="cell green"><div class="k">Net</div><div class="v">${Math.round(net)}</div></div>
    </div>
  </section>
  <section class="card">
    <h2>📋 Repas du jour</h2>
    ${meals.length?`<div class="food-list">${meals.map((m,i)=>`
      <div class="food-entry">
        <div>
          <div class="fn">${m.name}</div>
          <div class="fm">${m.qty} ${m.unit}</div>
        </div>
        <div style="display:flex;gap:8px;align-items:center;">
          <div style="font-weight:600;">${m.kcal} kcal</div>
          <button onclick="removeMeal(${i})">✕</button>
        </div>
      </div>
    `).join('')}</div>`:` <div class="empty">Aucun repas</div>`}
    <button class="btn" onclick="openMealModal()">Ajouter un repas</button>
  </section>
  <section class="card">
    <h2>💪 Séances</h2>
    ${workouts.length?`<div class="workout-list">${workouts.map((w,i)=>`
      <div class="workout-entry">
        <div>
          <div class="wn">${w.name}</div>
          <div class="wm">${w.duration}min • ${w.kcal} kcal</div>
        </div>
        <button onclick="removeWorkout(${i})">✕</button>
      </div>
    `).join('')}</div>`:` <div class="empty">Aucune séance</div>`}
    <button class="btn" onclick="openWorkoutModal()">Ajouter une séance</button>
  </section>
  `;
}

function renderMeals(){
  return `
  <section class="card">
    <h2>🍽️ Repas</h2>
    <input type="text" id="foodSearch" placeholder="Chercher un aliment..." style="margin-bottom:12px;">
    <div id="searchResults" class="search-results" style="display:none;"></div>
    ${state.meals.length?`<div class="food-list">${state.meals.map((m,i)=>`
      <div class="food-entry">
        <div><div class="fn">${m.name}</div><div class="fm">${m.qty} ${m.unit} • ${m.kcal}kcal</div></div>
        <button onclick="removeMeal(${i})">✕</button>
      </div>
    `).join('')}</div>`:' <div class="empty">Aucun repas</div>'}
    <button class="btn" onclick="openMealModal()">Ajouter un repas</button>
  </section>
  `;
}

function renderWorkouts(){
  return `
  <section class="card">
    <h2>💪 Séances d'entraînement</h2>
    <div class="wk-cards">
      <button class="wk-card" onclick="addQuickWorkout('Cardio',30,250)">
        <div class="ico"><svg viewBox="0 0 24 24"><path d="M12 2c5.5 0 10 4.5 10 10s-4.5 10-10 10S2 17.5 2 12 6.5 2 12 2z" stroke="none"/><path d="M8 12l2 2 4-4"/></svg></div>
        <div class="lbl">Cardio</div>
        <div class="hint">30 min</div>
      </button>
      <button class="wk-card" onclick="addQuickWorkout('Musculation',30,200)">
        <div class="ico"><svg viewBox="0 0 24 24"><rect x="2" y="9" width="20" height="6"/><circle cx="5" cy="9" r="2"/><circle cx="19" cy="9" r="2"/></svg></div>
        <div class="lbl">Musculation</div>
        <div class="hint">30 min</div>
      </button>
      <button class="wk-card" onclick="addQuickWorkout('Yoga',45,100)">
        <div class="ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="4" r="2"/><path d="M12 8v7M8 13l-3 3M16 13l3 3M10 20l2-4 2 4"/></svg></div>
        <div class="lbl">Yoga</div>
        <div class="hint">45 min</div>
      </button>
      <button class="wk-card" onclick="openWorkoutModal()">
        <div class="ico"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></div>
        <div class="lbl">Personnalisé</div>
        <div class="hint">+</div>
      </button>
    </div>
    ${state.workouts.length?`<div class="workout-list" style="margin-top:16px;">${state.workouts.map((w,i)=>`
      <div class="workout-entry">
        <div><div class="wn">${w.name}</div><div class="wm">${w.duration}min • ${w.kcal} kcal</div></div>
        <button onclick="removeWorkout(${i})">✕</button>
      </div>
    `).join('')}</div>`:' <div class="empty" style="margin-top:16px;">Aucune séance</div>'}
  </section>
  `;
}

function renderWeight(){
  const latest = state.weights.length > 0 ? state.weights[state.weights.length-1] : null;
  return `
  <section class="card">
    <h2>⚖️ Poids</h2>
    <div class="weight-input-row">
      <input type="number" id="weightInput" placeholder="Poids (kg)" step="0.1">
      <button class="btn" style="width:auto;margin:0;" onclick="addWeight()">Ajouter</button>
    </div>
    ${latest?`
      <div style="padding:12px;background:var(--surface-2);border-radius:10px;text-align:center;margin-bottom:14px;">
        <div style="font-size:12px;color:var(--ink-faint);margin-bottom:4px;">Poids actuel</div>
        <div style="font-family:var(--font-mono);font-size:28px;font-weight:700;color:var(--green);">${latest.weight} kg</div>
        <div style="font-size:11px;color:var(--ink-faint);margin-top:4px;">${new Date(latest.date).toLocaleDateString('fr-FR')}</div>
      </div>
    `:''}
    ${state.weights.length>1?`<h3 style="margin:14px 0 10px;font-size:13px;font-weight:600;color:var(--ink-soft);">HISTORIQUE</h3><div class="weight-history">${state.weights.slice().reverse().map(w=>`
      <div class="weight-entry">
        <div style="font-weight:600;">${w.weight} kg</div>
        <div class="d">${new Date(w.date).toLocaleDateString('fr-FR')}</div>
      </div>
    `).join('')}</div>`:' <div class="empty" style="margin-top:16px;">Ajoute plusieurs pesées</div>'}
  </section>
  `;
}

function renderHistory(){
  const today = new Date(); today.setHours(0,0,0,0);
  const days = [];
  for(let i=6;i>=0;i--){
    const d = new Date(today);
    d.setDate(d.getDate()-i);
    const dayMeals = state.meals.filter(m=>{ const md = new Date(m.date||Date.now()); md.setHours(0,0,0,0); return md.getTime()===d.getTime(); });
    const dayWo = state.workouts.filter(w=>{ const wd = new Date(w.date||Date.now()); wd.setHours(0,0,0,0); return wd.getTime()===d.getTime(); });
    const kcalIn = dayMeals.reduce((s,m)=>s+(m.kcal||0),0);
    const kcalOut = dayWo.reduce((s,w)=>s+(w.kcal||0),0);
    const net = kcalIn - kcalOut;
    days.push({ date:d, kcalIn, kcalOut, net });
  }

  const maxKcal = Math.max(...days.map(d=>Math.abs(d.net)||1));
  const weekSum = days.reduce((s,d)=>s+d.net,0);
  const weekAvg = Math.round(weekSum/7);

  return `
  <section class="card">
    <h2>📊 Semaine</h2>
    <div class="weekly-deficit">
      <h3>Déficit / Surplus semaine</h3>
      <div class="big" style="color:${weekSum>0?'var(--rust)':'var(--green)'};">${weekSum>0?'+':''}${Math.round(weekSum)}</div>
      <div class="sub">Moyenne: ${weekAvg>0?'+':''}${weekAvg} kcal/jour</div>
    </div>
    <div class="chart-bars">${days.map(d=>{
      const h = (Math.abs(d.net)/maxKcal*100).toFixed(1);
      return `<button class="hist-day ${d.net>0?'over':''}" style="--h:${h}%">
        <div class="bar"></div>
        <div class="d">${['L','M','M','J','V','S','D'][d.date.getDay()]}</div>
      </button>`;
    }).join('')}</div>
  </section>
  `;
}

function renderNotes(){
  return `
  <section class="card">
    <h2>📝 Notes</h2>
    <textarea id="notesInput" class="journal-textarea" placeholder="Notes libres...">${state.notes}</textarea>
    <button class="btn" onclick="saveNotes()">Enregistrer</button>
  </section>
  `;
}

function renderTodos(){
  return `
  <section class="card todo-intro">
    <h2>✓ To-do</h2>
    <p>Tes objectifs et habitudes du jour</p>
    <div class="todo-form">
      <input type="text" id="todoInput" placeholder="Ajouter une tâche...">
      <button class="btn" style="width:auto;margin:0;" onclick="addTodo()">+</button>
    </div>
  </section>
  ${state.todos.length?`<section class="card"><div class="todo-list">${state.todos.map((t,i)=>`
    <label class="todo-item ${t.done?'done':''}">
      <input type="checkbox" class="todo-check" ${t.done?'checked':''} onchange="toggleTodo(${i})">
      <span class="todo-label">${t.text}</span>
    </label>
  `).join('')}</div></section>`:' <section class="card"><div class="empty">Aucune tâche</div></section>'}
  `;
}

function renderSettings(){
  const profile = state.profile || {};
  const latest = state.weights.length > 0 ? state.weights[state.weights.length-1] : null;
  const goals = latest && profile.age ? {
    bmr: Math.round(10*latest.weight + 6.25*profile.height - 5*profile.age + (profile.sex==='H'?5:-161)),
    tdee: Math.round((10*latest.weight + 6.25*profile.height - 5*profile.age + (profile.sex==='H'?5:-161)) * (profile.activity==='sedentaire'?1.2:profile.activity==='leger'?1.375:profile.activity==='modere'?1.55:1.725))
  } : null;

  return `
  <section class="card">
    <h2>Objectif calorique</h2>
    <input type="number" id="calorieGoal" value="${state.settings.calorieGoal}" placeholder="Kcal/jour">
    <div class="hint">Objectif quotidien en calories</div>
    <button class="btn secondary" style="margin-top:12px;" onclick="saveSettings()">Enregistrer</button>
  </section>
  <section class="card">
    <h2 style="margin-top:16px;">Ton profil (pour le calcul)</h2>
    <label>Sexe</label>
    <div class="seg" id="pSexSeg">
      <button data-sex="H" class="${profile.sex==='H'?'active':''}">Homme</button>
      <button data-sex="F" class="${profile.sex==='F'?'active':''}">Femme</button>
    </div>
    <div class="row2">
      <div><label>Âge</label><input id="pAge" type="number" value="${profile.age}"></div>
      <div><label>Taille (cm)</label><input id="pHeight" type="number" value="${profile.height}"></div>
    </div>
    <label>Niveau d'activité</label>
    <div class="seg" id="pActSeg">
      ${[['sedentaire','Sédentaire'],['leger','Léger'],['modere','Modéré'],['intense','Intense']].map(([k,l])=>`<button data-act="${k}" class="${profile.activity===k?'active':''}">${l}</button>`).join('')}
    </div>
    <button class="btn secondary" id="saveProfile">Enregistrer le profil</button>
  </section>
  ${!latest ? `<section class="card"><div class="empty">Ajoute une première pesée pour débloquer le calcul.</div></section>` :
    !goals ? `<section class="card"><div class="empty">Renseigne ton âge et ta taille.</div></section>` :
    `<section class="card">
      <h2>Objectifs calculés (à partir de ${latest.weight} kg)</h2>
      <div class="trio">
        <div class="cell blue"><div class="k">Métabolisme (BMR)</div><div class="v">${goals.bmr}</div></div>
        <div class="cell green"><div class="k">Maintenance (TDEE)</div><div class="v">${goals.tdee}</div></div>
        <div class="cell rust" style="grid-column:1/-1;"><div class="k">Conseil</div><div class="v" style="font-size:14px;text-align:center;">Débute avec un objectif de ${Math.round(goals.tdee*0.85)} kcal pour perdre 0.5 kg/sem</div></div>
      </div>
    </section>`}
  <section class="card">
    <button class="btn" style="background:var(--rust);" onclick="clearAllData()">Tout réinitialiser</button>
  </section>
  `;
}

/* ===================== HELPERS ===================== */
function removeMeal(i){ state.meals.splice(i,1); saveState(); render(); }
function removeWorkout(i){ state.workouts.splice(i,1); saveState(); render(); }
function addWeight(){
  const w = parseFloat(document.getElementById('weightInput').value);
  if(w>0){ state.weights.push({weight:w,date:new Date().toISOString()}); document.getElementById('weightInput').value=''; saveState(); render(); }
}
function addTodo(){
  const t = document.getElementById('todoInput').value.trim();
  if(t){ state.todos.push({text:t,done:false}); document.getElementById('todoInput').value=''; saveState(); render(); }
}
function toggleTodo(i){ state.todos[i].done = !state.todos[i].done; saveState(); render(); }
function saveNotes(){ state.notes = document.getElementById('notesInput').value; saveState(); }
function saveSettings(){ state.settings.calorieGoal = parseInt(document.getElementById('calorieGoal').value); saveState(); render(); }
function addQuickWorkout(name,dur,kcal){ state.workouts.push({name,duration:dur,kcal,date:new Date().toISOString()}); saveState(); render(); }
function clearAllData(){ if(confirm('Réinitialiser?')){ Object.keys(state).forEach(k=>{ if(typeof state[k]==='object'&&!Array.isArray(state[k])) return; state[k]=Array.isArray(state[k])?[]:(typeof state[k]==='number'?0:''); }); saveState(); render(); }}

/* ===================== MODALS ===================== */
function openMealModal(){
  openModal(`<h3>Ajouter un repas</h3>
    <input type="text" id="mealName" placeholder="Nom du repas">
    <input type="number" id="mealQty" placeholder="Quantité" step="0.1">
    <input type="text" id="mealUnit" placeholder="Unité (g, ml, etc)">
    <input type="number" id="mealKcal" placeholder="Calories">
    <button class="btn" onclick="saveMeal()">Ajouter</button>`);
}
function openWorkoutModal(){
  openModal(`<h3>Ajouter une séance</h3>
    <input type="text" id="woName" placeholder="Nom de la séance">
    <input type="number" id="woDuration" placeholder="Durée (min)">
    <input type="number" id="woKcal" placeholder="Calories brûlées">
    <button class="btn" onclick="saveWorkout()">Ajouter</button>`);
}
function saveMeal(){
  const m = { name:document.getElementById('mealName').value, qty:document.getElementById('mealQty').value, unit:document.getElementById('mealUnit').value, kcal:parseInt(document.getElementById('mealKcal').value)||0, date:new Date().toISOString() };
  if(m.name&&m.kcal>0){ state.meals.push(m); closeModal(); saveState(); render(); }
}
function saveWorkout(){
  const w = { name:document.getElementById('woName').value, duration:parseInt(document.getElementById('woDuration').value)||0, kcal:parseInt(document.getElementById('woKcal').value)||0, date:new Date().toISOString() };
  if(w.name&&w.duration>0&&w.kcal>0){ state.workouts.push(w); closeModal(); saveState(); render(); }
}
function openModal(html){
  document.getElementById('modal-root').innerHTML = `<div class="modal-bg" id="modalBg"><div class="modal modal-wrap">
    <button class="close" id="modalClose">✕</button>${html}</div></div>`;
  document.getElementById('modalBg').addEventListener('click', e=>{ if(e.target.id==='modalBg') closeModal(); });
  document.getElementById('modalClose').addEventListener('click', closeModal);
}
function closeModal(){ document.getElementById('modal-root').innerHTML=''; }

/* ===================== THEME ===================== */
function applyTheme(){
  const theme = LS.get('ct_theme', 'light');
  document.body.classList.toggle('dark', theme==='dark');
}
document.getElementById('themeToggle')?.addEventListener('click', ()=>{
  const isDark = document.body.classList.toggle('dark');
  LS.set('ct_theme', isDark?'dark':'light');
});

/* ===================== INIT ===================== */
applyTheme();
render();

// Attacher les événements au profil
window.addEventListener('DOMContentLoaded', ()=>{
  document.getElementById('pSexSeg')?.addEventListener('click',(e)=>{
    if(e.target.dataset.sex){ state.profile.sex=e.target.dataset.sex; document.getElementById('saveProfile')?.click(); }
  });
  document.getElementById('pActSeg')?.addEventListener('click',(e)=>{
    if(e.target.dataset.act){ state.profile.activity=e.target.dataset.act; document.getElementById('saveProfile')?.click(); }
  });
  document.getElementById('saveProfile')?.addEventListener('click',()=>{
    state.profile.age=parseInt(document.getElementById('pAge').value);
    state.profile.height=parseInt(document.getElementById('pHeight').value);
    saveState(); render();
  });
});
</script>
</body>
</html>
