<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Carnet</title>
<link rel="icon" href="data:,">
<style>
  :root{
    --paper:#F1F5F0;
    --surface:#FFFFFF;
    --surface-2:#E7EEE5;
    --ink:#1C2B22;
    --ink-soft:#5B6B5E;
    --ink-faint:#93A395;
    --blue:#3A62D8;
    --blue-soft:#E4E9FC;
    --rust:#E4602F;
    --rust-soft:#FCE3D6;
    --green:#1E8F63;
    --green-soft:#DEF2E7;
    --amber:#D99A2B;
    --accent-neutral:#6E7F72;
    --accent-neutral-soft:#E8EEE8;
    --journal-paper:#FBF8F1;
    --line:#E6E9E3;
    --radius:16px;
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Consolas, monospace;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:var(--font-sans);
    background:var(--paper);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  #app{max-width:520px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; background:transparent;}

  header.top{
    padding:20px 18px 12px;
    display:flex; align-items:baseline; justify-content:space-between;
  }
  header.top .brand{
    font-family:var(--font-sans); font-weight:800; font-size:20px; letter-spacing:-0.02em; color:var(--green);
  }
  header.top .brand small{display:block; font-weight:500; font-size:11px; color:var(--ink-soft); letter-spacing:.02em; margin-top:1px;}

  main{flex:1; padding:0 16px 90px; overflow-y:auto;}

  .daybar{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--surface); border:none; border-radius:20px;
    padding:10px 12px; margin-bottom:16px;
    box-shadow:0 1px 3px rgba(28,43,34,.06), 0 8px 24px rgba(28,43,34,.04);
  }
  .daybar button{
    background:var(--green-soft); border:none; font-size:17px; color:var(--green); width:32px; height:32px; line-height:32px; text-align:center; padding:0; cursor:pointer; border-radius:10px;
  }
  .daybar button:active{background:var(--green); color:#fff;}
  .daybar .label{font-weight:700; font-size:14px; text-transform:capitalize;}
  .daybar .label small{display:block; font-weight:500; color:var(--ink-faint); font-size:11px; text-transform:none;}

  section.card{
    background:var(--surface); border:none; border-radius:20px;
    padding:18px; margin-bottom:16px;
    box-shadow:0 1px 3px rgba(28,43,34,.06), 0 8px 24px rgba(28,43,34,.04);
  }
  .card h2{margin:0 0 12px; font-size:12.5px; font-weight:700; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em;}

  .hero-remaining{text-align:left; margin-bottom:6px;}
  .hero-remaining .num{font-family:var(--font-mono); font-size:46px; font-weight:700; line-height:1; letter-spacing:-0.02em; color:var(--green);}
  .hero-remaining .num.neg{color:var(--rust);}
  .hero-remaining .unit{font-family:var(--font-mono); font-size:16px; color:var(--ink-soft); margin-left:6px;}
  .hero-remaining .desc{font-size:13px; color:var(--ink-soft); margin-top:4px;}

  .bar{height:9px; border-radius:6px; background:var(--surface-2); overflow:hidden; margin-top:12px;}
  .bar > div{height:100%; background:var(--green); border-radius:6px; transition:width .25s ease;}
  .bar.over > div{background:var(--rust);}

  .trio{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-top:14px;}
  .trio .cell{border-top:none; border-radius:12px; padding:12px 8px; text-align:center; background:var(--surface-2);}
  .trio .cell .k{font-size:10.5px; color:var(--ink-soft);}
  .trio .cell .v{font-family:var(--font-mono); font-weight:700; font-size:17px; margin-top:3px; color:var(--ink);}
  .trio .cell.blue{background:var(--blue-soft);}
  .trio .cell.blue .v{color:var(--blue);}
  .trio .cell.rust{background:var(--rust-soft);}
  .trio .cell.rust .v{color:var(--rust);}
  .trio .cell.green{background:var(--green-soft);}
  .trio .cell.green .v{color:var(--green);}

  .macro-row{display:flex; align-items:center; gap:10px; margin-top:10px;}
  .macro-row .name{width:56px; font-size:12px; color:var(--ink-soft);}
  .macro-row .bar{flex:1; margin-top:0;}
  .macro-row .amt{font-family:var(--font-mono); font-size:12px; width:78px; text-align:right; color:var(--ink-soft);}

  .list-entry{
    display:flex; justify-content:space-between; align-items:center;
    padding:11px 0; border-bottom:1px solid var(--line);
  }
  .list-entry:last-child{border-bottom:none;}
  .list-entry .main{flex:1; min-width:0;}
  .list-entry .title{font-size:14px; font-weight:600;}
  .list-entry .sub{font-size:12px; color:var(--ink-faint); margin-top:1px; white-space:pre-wrap;}
  .list-entry .amount{font-family:var(--font-mono); font-size:14px; font-weight:700; margin-left:10px; white-space:nowrap;}
  .list-entry .amount.rust{color:var(--rust);}
  .list-entry .amount.blue{color:var(--blue);}
  .list-entry button.del{
    background:none; border:none; color:var(--ink-faint); font-size:16px; padding:4px 6px; margin-left:4px; cursor:pointer;
  }
  .empty{color:var(--ink-faint); font-size:13px; padding:8px 0;}

  input, textarea, select{
    width:100%; font-family:var(--font-sans); font-size:15px; color:var(--ink);
    background:var(--paper); border:1px solid transparent; border-radius:10px;
    padding:11px 12px; margin-top:4px;
  }
  input:focus, textarea:focus, select:focus{outline:none; border-color:var(--green); background:var(--surface); box-shadow:0 0 0 3px var(--green-soft);}
  label{font-size:12px; color:var(--ink-soft); font-weight:600; display:block; margin-top:12px;}
  label:first-child{margin-top:0;}
  textarea{min-height:90px; resize:vertical; font-family:var(--font-mono); font-size:13.5px;}

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    background:var(--green); color:#fff; border:none; border-radius:12px;
    font-family:var(--font-sans); font-size:14px; font-weight:700; padding:13px 16px;
    cursor:pointer; width:100%; margin-top:14px;
  }
  .btn:active{opacity:.85;}
  .btn.secondary{background:var(--blue-soft); color:var(--blue); border:none;}
  .btn.ghost{background:var(--surface-2); color:var(--ink-soft); border:none;}
  .btn.rust{background:var(--rust);}
  .btn.small{width:auto; padding:8px 12px; font-size:13px; margin-top:0;}

  .search-results{margin-top:10px; max-height:260px; overflow-y:auto; border-top:1px solid var(--line);}
  .food-row{
    display:flex; justify-content:space-between; align-items:center;
    padding:10px 2px; border-bottom:1px solid var(--line); cursor:pointer;
  }
  .food-row:active{background:var(--green-soft);}
  .food-row .fn{font-size:14px; font-weight:600;}
  .food-row .fm{font-size:11px; color:var(--ink-faint); font-family:var(--font-mono);}
  .food-row button.edit{background:var(--surface-2); border:none; border-radius:8px; color:var(--ink-soft); font-size:13px; padding:5px 9px; margin-left:8px; cursor:pointer; flex-shrink:0;}
  .food-row button.edit:active{background:var(--blue-soft); color:var(--blue);}
  .food-row button.star{background:none; border:none; color:var(--ink-faint); font-size:19px; padding:2px 4px; margin-left:6px; cursor:pointer; flex-shrink:0; line-height:1;}
  .food-row button.star.active{color:var(--amber);}

  .seg{display:flex; gap:6px; margin-top:4px;}
  .seg button{
    flex:1; padding:9px 4px; font-size:12.5px; border:none; background:var(--surface-2);
    border-radius:9px; color:var(--ink-soft); font-family:var(--font-sans); cursor:pointer;
  }
  .seg button.active{background:var(--green); color:#fff;}
  .preset-row{display:flex; flex-wrap:wrap; gap:8px; margin-top:6px;}
  .preset-chip{background:var(--green-soft); border:none; border-radius:20px; padding:8px 14px; font-size:13px; color:var(--green); font-weight:600; font-family:var(--font-sans); cursor:pointer;}
  .preset-chip:active{background:var(--green); color:#fff;}

  nav.tabs{
    position:fixed; bottom:0; left:0; right:0;
    background:rgba(255,255,255,.94); border-top:1px solid var(--line);
    display:flex; max-width:520px; margin:0 auto;
    padding-bottom:env(safe-area-inset-bottom);
    box-shadow:0 -8px 24px rgba(28,43,34,.05);
    z-index:20;
  }
  nav.tabs button{
    position:relative; flex:1; background:none; border:none; padding:10px 2px 8px; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:3px;
    color:var(--ink-faint); font-family:var(--font-sans); font-size:10px; font-weight:600;
    transition:color .2s ease, transform .2s ease;
  }
  nav.tabs button::after{
    content:""; position:absolute; left:22%; right:22%; bottom:0; height:3px;
    border-radius:3px 3px 0 0; background:var(--green);
    transform:scaleX(0); transform-origin:center; opacity:0;
    transition:transform .25s cubic-bezier(.22,1,.36,1), opacity .2s ease;
  }
  nav.tabs button.active::after{transform:scaleX(1); opacity:1;}
  nav.tabs button:active{transform:translateY(1px);}
  nav.tabs button[title]::before{content:attr(title); display:none;}
  nav.tabs button svg{width:19px; height:19px; stroke:var(--ink-faint); fill:none; stroke-width:1.8;}
  nav.tabs button.active{color:var(--green);}
  nav.tabs button.active svg{stroke:var(--green);}
  @media (max-width:390px){
    nav.tabs button{font-size:0; padding-top:11px;}
    nav.tabs button svg{width:20px; height:20px;}
    nav.tabs button:hover::before, nav.tabs button:focus-visible::before{
      display:block; position:absolute; bottom:48px; left:50%; transform:translateX(-50%);
      white-space:nowrap; background:var(--ink); color:#fff; padding:5px 8px;
      border-radius:8px; font-size:11px; font-weight:600; z-index:30;
    }
  }

  .modal-bg{
    position:fixed; inset:0; background:rgba(20,30,23,.5); display:flex; align-items:flex-end;
    z-index:50;
  }
  .modal{
    background:var(--paper); width:100%; max-width:520px; margin:0 auto;
    border-radius:20px 20px 0 0; padding:20px 18px calc(20px + env(safe-area-inset-bottom));
    max-height:85vh; overflow-y:auto;
  }
  .modal h3{margin:0 0 4px; font-size:16px;}
  .modal .close{position:absolute; top:14px; right:16px; background:none; border:none; font-size:20px; color:var(--ink-soft);}
  .modal-wrap{position:relative;}

  .qty-preview{display:flex; gap:14px; margin-top:14px; padding:12px; background:var(--surface); border:none; border-radius:12px; box-shadow:0 1px 2px rgba(28,43,34,.05), 0 4px 14px rgba(28,43,34,.04);}
  .qty-preview .item{flex:1; text-align:center;}
  .qty-preview .item .n{font-family:var(--font-mono); font-weight:700; font-size:15px;}
  .qty-preview .item .l{font-size:10px; color:var(--ink-faint); margin-top:2px;}

  .toast{
    position:fixed; bottom:78px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:var(--surface); padding:9px 16px; border-radius:20px;
    font-size:13px; z-index:80; opacity:0; pointer-events:none; transition:opacity .2s ease;
  }
  .toast.show{opacity:1;}

  .hist-day{border:none; border-radius:14px; margin-bottom:10px; overflow:hidden; background:var(--surface); box-shadow:0 1px 2px rgba(28,43,34,.05), 0 4px 14px rgba(28,43,34,.04);}
  .hist-head{display:flex; justify-content:space-between; align-items:center; padding:13px 14px; cursor:pointer; background:var(--surface);}
  .hist-head .d{font-weight:700; font-size:13.5px; text-transform:capitalize;}
  .hist-head .n{font-family:var(--font-mono); font-size:13px; color:var(--ink-soft);}
  .hist-body{padding:0 14px 12px; display:none;}
  .hist-body.open{display:block;}
  .weekly-deficit{
    position:relative; overflow:hidden; padding:17px 16px 15px; margin-bottom:16px;
    background:linear-gradient(135deg, #193c2d 0%, #245843 100%); color:#fff;
    border-radius:16px; box-shadow:0 8px 22px rgba(28,43,34,.13);
  }
  .weekly-deficit::after{content:""; position:absolute; width:130px; height:130px; border:1px solid rgba(255,255,255,.15); border-radius:50%; right:-48px; top:-54px;}
  .weekly-deficit .eyebrow{position:relative; z-index:1; font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:#b8d8c5; font-weight:700;}
  .weekly-deficit .range{position:relative; z-index:1; margin-top:5px; font-size:14px; font-weight:650; text-transform:capitalize;}
  .weekly-deficit .total{position:relative; z-index:1; margin-top:13px; font-family:var(--font-mono); font-size:28px; font-weight:800; letter-spacing:-.03em;}
  .weekly-deficit .total.surplus{color:#ffc3a9;}
  .weekly-deficit .total.deficit{color:#d5f3df;}
  .weekly-deficit .meta{position:relative; z-index:1; margin-top:5px; font-size:11.5px; color:#b8d8c5;}
  .weekly-deficit.past{background:var(--surface); color:var(--ink); box-shadow:0 1px 2px rgba(28,43,34,.05), 0 4px 14px rgba(28,43,34,.04); border:1px solid var(--line);}
  .weekly-deficit.past::after{border-color:rgba(30,143,99,.13);}
  .weekly-deficit.past .eyebrow,.weekly-deficit.past .meta{color:var(--ink-soft);}
  .weekly-deficit.past .range{color:var(--ink);}
  .weekly-deficit.past .total.deficit{color:var(--green);}
  .weekly-deficit.past .total.surplus{color:var(--rust);}
  .weekly-history-label{font-size:12px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.06em; font-weight:700; margin:4px 0 10px;}

  h1.page-title{font-size:19px; margin:2px 0 14px; letter-spacing:-0.01em;}
  .hint{font-size:12px; color:var(--ink-faint); margin-top:6px; line-height:1.4;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}

  /* --- Onglet To-do : objectifs et habitudes quotidiennes --- */
  .todo-intro{background:linear-gradient(135deg,#193c2d 0%,#245843 100%);color:#fff;position:relative;overflow:hidden;}
  .todo-intro::after{content:"✓";position:absolute;right:18px;top:8px;font-size:76px;font-weight:800;color:rgba(255,255,255,.09);transform:rotate(-10deg);}
  .todo-intro h2,.todo-intro p{position:relative;z-index:1}.todo-intro p{color:#c7e4d1;margin:5px 0 0;font-size:12px;line-height:1.45;max-width:330px}
  .todo-form{display:grid;grid-template-columns:1fr auto;gap:9px;align-items:center;margin-top:12px}
  .todo-form input{min-width:0}.todo-form .btn{padding-left:14px;padding-right:14px}
  .todo-options{grid-column:1 / -1;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-soft)}
  .todo-options input{accent-color:var(--green);width:16px;height:16px}
  .todo-list{display:flex;flex-direction:column;gap:8px;margin-top:2px}
  .todo-item{display:flex;align-items:center;gap:10px;padding:11px 10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 1px 2px rgba(28,43,34,.04)}
  .todo-item.done{background:var(--surface-2)}.todo-item.done .todo-label{text-decoration:line-through;color:var(--ink-faint)}
  .todo-check{
    appearance:none; -webkit-appearance:none; width:21px; height:21px; flex:0 0 21px;
    border:1.5px solid var(--ink-faint); border-radius:7px; background:var(--surface);
    cursor:pointer; display:grid; place-content:center; transition:background .2s ease, border-color .2s ease, transform .18s ease;
  }
  .todo-check::after{content:"✓"; color:#fff; font-size:14px; font-weight:800; transform:scale(0); transition:transform .18s cubic-bezier(.22,1.45,.36,1);}
  .todo-check:checked{background:var(--green); border-color:var(--green); transform:scale(1.06);}
  .todo-check:checked::after{transform:scale(1);}
  .todo-check:active{transform:scale(.88);}
  .todo-check:focus-visible{outline:3px solid var(--green-soft); outline-offset:2px;}
  .todo-copy{min-width:0;flex:1}.todo-label{font-size:14px;font-weight:650;overflow-wrap:anywhere}.todo-kind{display:inline-block;margin-top:4px;padding:3px 7px;border-radius:10px;background:var(--green-soft);color:var(--green);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
  .todo-actions{display:flex;gap:3px}.todo-actions button{border:0;background:transparent;color:var(--ink-faint);font-size:15px;padding:5px;cursor:pointer;border-radius:7px}.todo-actions button:hover{background:var(--surface-2);color:var(--ink)}
  .todo-progress{
    display:block; margin-top:10px; font-family:var(--font-mono); font-size:11px;
    color:var(--ink-soft); font-weight:600; text-transform:none; letter-spacing:0;
  }
  .todo-progress-bar{height:6px; margin-top:7px; border-radius:10px; background:var(--surface-2); overflow:hidden;}
  .todo-progress-bar > span{display:block; height:100%; width:var(--progress,0%); border-radius:inherit; background:var(--green); transform-origin:left; animation:progressIn .55s cubic-bezier(.22,1,.36,1);}
  @keyframes progressIn{from{transform:scaleX(0)}to{transform:scaleX(1)}}

  /* --- Onglet Notes : style carnet / page de rédaction --- */
  section.card.journal{
    background:var(--journal-paper);
  }
  .journal-textarea{
    width:100%; font-family:Georgia,"Iowan Old Style","Times New Roman",serif;
    font-size:15px; color:var(--ink); line-height:28px;
    background-image:linear-gradient(rgba(120,105,75,.035) 1px, transparent 1px), repeating-linear-gradient(to bottom, transparent 0, transparent 27px, #DDE4D9 27px, #DDE4D9 28px);
    background-size:100% 5px, 100% 28px;
    background-attachment:local;
    border:none; border-left:2px solid var(--accent-neutral-soft);
    border-radius:0; padding:0 10px 4px 16px; margin-top:8px;
    min-height:168px; resize:vertical;
  }
  .journal-textarea:focus{outline:none; border-left-color:var(--accent-neutral);}
  .journal-entry{
    padding:12px 4px 12px 16px; border-left:2px solid var(--accent-neutral-soft); border-bottom:1px dashed var(--line);
    position:relative;
  }
  .journal-entry:last-child{border-bottom:none;}
  .journal-entry .jdate{
    font-family:var(--font-sans); font-size:10.5px; font-weight:700; color:var(--green);
    display:inline-block; background:var(--green-soft); padding:2px 8px; border-radius:20px;
    text-transform:uppercase; letter-spacing:.05em;
  }
  .journal-entry .jtext{
    font-family:Georgia,"Iowan Old Style","Times New Roman",serif; font-size:15.5px; line-height:1.6;
    color:var(--ink); margin-top:4px; white-space:pre-wrap; padding-right:22px;
  }
  .journal-entry .jdel{
    position:absolute; top:12px; right:2px; background:none; border:none; color:var(--ink-faint);
    font-size:14px; cursor:pointer; padding:2px 4px;
  }

  /* ====== V14 — Dashboard, charts, toasts, dark mode ====== */

  /* Smooth color transitions for theme switching */
  body, body * { transition-property: background-color, color, border-color, fill, stroke; transition-duration: .35s; transition-timing-function: ease; }

  /* ---- Dark theme: duplicated palette under body.dark ---- */
  body.dark{
    --paper:#0E1411;
    --surface:#171F1B;
    --surface-2:#222C26;
    --ink:#E8F1EA;
    --ink-soft:#9CB3A1;
    --ink-faint:#6D8473;
    --blue:#7A98F2;
    --blue-soft:#1F2A4A;
    --rust:#F0875A;
    --rust-soft:#3A1F18;
    --green:#46C18C;
    --green-soft:#163527;
    --amber:#E8B85A;
    --accent-neutral:#8C9D90;
    --accent-neutral-soft:#243027;
    --journal-paper:#14201B;
    --line:#28332C;
  }
  body.dark #app{background:transparent;}
  body.dark section.card{background:var(--surface); box-shadow:0 1px 3px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);}
  body.dark nav.tabs{background:rgba(23,31,27,.94);}
  body.dark input, body.dark textarea, body.dark select{background:var(--surface-2); color:var(--ink);}
  body.dark .journal-textarea{background-image:linear-gradient(rgba(180,165,135,.05) 1px, transparent 1px), repeating-linear-gradient(to bottom, transparent 0, transparent 27px, #243027 27px, #243027 28px);}
  body.dark .weekly-deficit{background:linear-gradient(135deg,#0F2620 0%,#1B4336 100%);}
  body.dark .weekly-deficit.past{background:var(--surface);}
  body.dark .hist-day{background:var(--surface);}
  body.dark .todo-item{background:var(--surface);}
  body.dark .todo-intro{background:linear-gradient(135deg,#0F2620 0%,#1B4336 100%);}
  body.dark .seg button:not(.active){background:var(--surface-2); color:var(--ink-soft);}

  /* ---- Theme toggle button (header) ---- */
  .theme-toggle{
    background:var(--surface-2); border:none; border-radius:12px;
    width:44px; height:44px; display:grid; place-content:center; cursor:pointer;
    color:var(--ink-soft); margin-left:10px; flex-shrink:0;
    box-shadow:0 1px 2px rgba(28,43,34,.05);
  }
  .theme-toggle:active{transform:scale(.95);}
  .theme-toggle svg{width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:1.8;}
  body.dark .theme-toggle{color:var(--amber);}

  /* ---- Touch targets: 44px minimum ---- */
  .btn{ min-height:44px; }
  .seg button{ min-height:44px; }
  .preset-chip{ min-height:44px; }
  .food-row{ min-height:44px; padding:12px 4px; }
  .daybar button{ width:44px; height:44px; line-height:44px; border-radius:12px; }
  .list-entry .del{ min-width:44px; min-height:44px; display:inline-grid; place-content:center; border-radius:10px; }
  .food-row button.star{ min-width:44px; min-height:44px; }
  .food-row button.edit{ min-height:36px; }
  .todo-check{ min-width:44px; min-height:44px; appearance:none; position:relative; }
  .todo-check::before{content:""; position:absolute; inset:50% 50%; transform:translate(-50%,-50%); width:21px; height:21px; border-radius:7px; border:1.5px solid var(--ink-faint); background:var(--surface); transition:background .2s ease, border-color .2s ease, transform .18s ease;}
  .todo-check:checked::before{background:var(--green); border-color:var(--green);}
  .todo-actions button{ min-width:44px; min-height:44px; border-radius:10px; }
  .journal-entry .jdel{ min-width:44px; min-height:44px; border-radius:10px; }
  /* checkbox-friendly padding area around the visual box */
  .todo-check{ background:transparent; }
  .todo-check:focus-visible::before{outline:3px solid var(--green-soft); outline-offset:3px;}

  /* ---- Flash confirmation ---- */
  @keyframes flashBg{
    0%{background:rgba(70,193,140,0); box-shadow:0 0 0 0 rgba(70,193,140,0);}
    25%{background:rgba(70,193,140,.25); box-shadow:0 0 0 6px rgba(70,193,140,.15);}
    100%{background:rgba(70,193,140,0); box-shadow:0 0 0 0 rgba(70,193,140,0);}
  }
  .flash{ animation: flashBg .8s ease-out; }
  @keyframes flashRust{
    0%{background:rgba(240,135,90,0);}
    25%{background:rgba(240,135,90,.22);}
    100%{background:rgba(240,135,90,0);}
  }
  .flash-warn{ animation: flashRust .8s ease-out; }

  /* ---- Entry fade+slide animation ---- */
  @keyframes entryIn{ from{ opacity:0; transform:translateY(-6px);} to{ opacity:1; transform:translateY(0);} }
  @keyframes entryOut{ from{ opacity:1; transform:translateX(0);} to{ opacity:0; transform:translateX(20px);} }
  .list-entry.enter{ animation: entryIn .35s cubic-bezier(.22,1,.36,1); }
  .list-entry.leave{ animation: entryOut .35s ease forwards; pointer-events:none; }
  .food-row.enter{ animation: entryIn .3s cubic-bezier(.22,1,.36,1); }

  /* ---- Toast: icon + slide+fade ---- */
  .toast{
    display:inline-flex; align-items:center; gap:8px;
    padding:10px 18px;
    border-radius:22px;
    background:var(--ink); color:var(--surface);
    box-shadow:0 8px 22px rgba(20,30,23,.25);
    transform:translate(-50%, 12px);
  }
  .toast .ico{width:16px; height:16px; flex:0 0 16px; stroke:currentColor; fill:none; stroke-width:2.2;}
  .toast.show{ transform:translate(-50%, 0); }
  .toast.success{ background:linear-gradient(135deg,#1E8F63,#46C18C); color:#fff; }
  .toast.warn{ background:linear-gradient(135deg,#D99A2B,#E8B85A); color:#1C2B22; }
  .toast.error{ background:linear-gradient(135deg,#E4602F,#F0875A); color:#fff; }
  .toast.info{ background:linear-gradient(135deg,#3A62D8,#7A98F2); color:#fff; }

  /* ---- Dashboard SVG ring ---- */
  .kcal-ring-wrap{ position:relative; display:flex; align-items:center; gap:18px; }
  .kcal-ring{ width:120px; height:120px; flex-shrink:0; }
  .kcal-ring .track{ stroke:var(--surface-2); }
  .kcal-ring .fill{ stroke:var(--green); transition:stroke-dashoffset .55s cubic-bezier(.22,1,.36,1), stroke .2s ease; }
  .kcal-ring.over .fill{ stroke:var(--rust); }
  .kcal-ring text{ font-family:var(--font-mono); font-weight:700; }
  .kcal-summary{ flex:1; min-width:0; }
  .kcal-summary .big{ font-family:var(--font-mono); font-size:32px; font-weight:700; line-height:1.1; letter-spacing:-.02em; color:var(--green); }
  .kcal-summary .big.neg{ color:var(--rust); }
  .kcal-summary .sub{ font-size:13px; color:var(--ink-soft); margin-top:2px; line-height:1.45; }
  .kcal-summary .pill{ display:inline-block; padding:2px 8px; border-radius:20px; background:var(--surface-2); color:var(--ink-soft); font-size:11px; font-weight:600; margin-top:6px; }

  /* ---- Mini bar chart 7 days calories ---- */
  .mini-bars{ display:flex; align-items:flex-end; gap:6px; height:64px; margin-top:10px; padding:4px 0; }
  .mini-bars .bar-col{ flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; min-width:0; }
  .mini-bars .bar-col .b{ width:100%; background:var(--green); border-radius:5px 5px 2px 2px; min-height:2px; transition:height .35s ease; }
  .mini-bars .bar-col.today .b{ background:linear-gradient(180deg,var(--green),#46C18C); }
  .mini-bars .bar-col.empty .b{ background:var(--surface-2); }
  .mini-bars .bar-col .l{ font-size:10px; color:var(--ink-faint); font-weight:600; text-transform:uppercase; }
  .mini-bars .axis{ font-family:var(--font-mono); font-size:10px; color:var(--ink-faint); text-align:right; margin-top:4px; }

  /* ---- Recent foods section ---- */
  .recent-label{ display:flex; align-items:center; gap:8px; margin:6px 0 4px; color:var(--ink-soft); font-size:11px; text-transform:uppercase; letter-spacing:.06em; font-weight:700; }
  .recent-label::before{ content:""; flex:0 0 14px; height:2px; background:var(--green-soft); border-radius:2px; }
  .recent-label::after{ content:""; flex:1; height:2px; background:var(--green-soft); border-radius:2px; opacity:.5; }

  /* ---- Workout type cards ---- */
  .wk-cards{ display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-top:6px; }
  .wk-card{
    background:var(--surface); border:1.5px solid var(--line); border-radius:14px;
    padding:14px 12px; cursor:pointer; display:flex; flex-direction:column; gap:8px;
    transition:transform .15s ease, border-color .15s ease, background .2s ease;
    min-height:96px; text-align:left; font-family:inherit; color:inherit;
  }
  .wk-card:active{ transform:scale(.97); }
  .wk-card.active{ border-color:var(--green); background:var(--green-soft); }
  .wk-card .ico{ width:34px; height:34px; display:grid; place-content:center; border-radius:10px; background:var(--surface-2); color:var(--green); }
  .wk-card .ico svg{ width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:1.7; }
  .wk-card.active .ico{ background:var(--green); color:#fff; }
  .wk-card .lbl{ font-size:13.5px; font-weight:700; }
  .wk-card .hint{ font-size:11px; color:var(--ink-faint); }

  /* Live kcal estimate pill */
  .wk-estimate{
    display:flex; align-items:center; gap:10px;
    margin-top:14px; padding:11px 13px;
    background:linear-gradient(135deg, var(--blue-soft), var(--green-soft));
    border-radius:12px;
    font-family:var(--font-mono);
    transition:background .3s ease;
  }
  body.dark .wk-estimate{background:linear-gradient(135deg, rgba(122,152,242,.18), rgba(70,193,140,.18));}
  .wk-estimate .num{ font-size:22px; font-weight:800; color:var(--blue); }
  .wk-estimate .lbl{ font-family:var(--font-sans); font-size:12px; color:var(--ink-soft); }
  .wk-estimate .num.over{ color:var(--rust); }
  .wk-estimate.pulse .num{ animation: pulseKcal .4s ease; }
  @keyframes pulseKcal{ 0%{transform:scale(1);} 50%{transform:scale(1.12);} 100%{transform:scale(1);} }

</style>

function allFoods(){
  const builtin = BUILTIN_FOODS.map(f => foodOverrides[f.id] ? {...f, ...foodOverrides[f.id]} : f);
  return [...customFoods, ...builtin];
}
function todayStr(){ return fmtDate(new Date()); }
function fmtDate(d){ return d.toISOString().slice(0,10); }
function shiftDate(dateStr, delta){ const d=new Date(dateStr+'T12:00:00'); d.setDate(d.getDate()+delta); return fmtDate(d); }
function dateLabel(dateStr){
  const d = new Date(dateStr+'T12:00:00');
  const t = new Date(); const y = new Date(); y.setDate(t.getDate()-1); const tm = new Date(); tm.setDate(t.getDate()+1);
  if(dateStr===fmtDate(t)) return "Aujourd'hui";
  if(dateStr===fmtDate(y)) return "Hier";
  if(dateStr===fmtDate(tm)) return "Demain";
  return d.toLocaleDateString('fr-FR', {weekday:'long', day:'numeric', month:'long'});
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function save(){
  LS.set('ct_settings',settings); LS.set('ct_customFoods',customFoods); LS.set('ct_foodOverrides',foodOverrides);
  LS.set('ct_favorites',favorites); LS.set('ct_weight',weightEntries); LS.set('ct_profile',profile);
  LS.set('ct_wpresets',workoutPresets);
  LS.set('ct_log',logEntries);
  LS.set('ct_todos',todos);
}

function toggleFavorite(id){

}
const TOAST_ICONS = {
  success: '<svg class="ico" viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"/></svg>',
  warn:    '<svg class="ico" viewBox="0 0 24 24"><path d="M12 3l10 18H2z"/><path d="M12 10v5M12 17.5v.5"/></svg>',
  error:   '<svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15 9l-6 6M9 9l6 6"/></svg>',
  info:    '<svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v.01M11 12h2v5"/></svg>',
};
function toast(msg, kind='info'){
  const t=document.getElementById('toast');
  t.className = 'toast ' + kind;
  t.innerHTML = (TOAST_ICONS[kind]||TOAST_ICONS.info) + '<span>'+msg+'</span>';
  // restart animation
  requestAnimationFrame(()=>t.classList.add('show'));
  clearTimeout(window.__toastT);
  window.__toastT=setTimeout(()=>{ t.classList.remove('show'); }, 2200);
}
function flashEl(el){
  if(!el) return;
  el.classList.remove('flash'); void el.offsetWidth;
  el.classList.add('flash');
  setTimeout(()=>el.classList.remove('flash'), 900);
}

function entriesFor(date){ return logEntries.filter(e=>e.date===date); }
function dayTotals(date){
  const es = entriesFor(date);
  let kcalIn=0, kcalOut=0, protein=0, carbs=0, fat=0;
  es.forEach(e=>{
    if(e.type==='meal'){ kcalIn+=e.kcal; protein+=e.protein; carbs+=e.carbs; fat+=e.fat; }
    else if(e.type==='workout'){ kcalOut += e.kcalBurned; }
  });
  return {kcalIn,kcalOut,protein,carbs,fat,net:kcalIn-kcalOut};
}

// Les semaines sont ancrées au lundi. Le déficit ignore volontairement les séances :
// objectif quotidien - calories consommées, et les jours sans repas ne comptent pas.
function weekStart(dateStr){
  const d = new Date(dateStr+'T12:00:00');
  const mondayOffset = (d.getDay()+6)%7;
  d.setDate(d.getDate()-mondayOffset);
  return fmtDate(d);
}
function weekEnd(startStr){ return shiftDate(startStr, 6); }
function weeklyDeficit(startStr){
  const endStr = weekEnd(startStr);
  const days = [...new Set(logEntries.filter(e=>e.type==='meal' && e.date>=startStr && e.date<=endStr).map(e=>e.date))].sort();
  const dayValues = days.map(date=>({date, calories:dayTotals(date).kcalIn, deficit:settings.calorieGoal-dayTotals(date).kcalIn}));
  return {start:startStr, end:endStr, days:dayValues, total:dayValues.reduce((sum,d)=>sum+d.deficit,0)};
}
function weeklyDeficits(){
  const starts = [...new Set(logEntries.filter(e=>e.type==='meal').map(e=>weekStart(e.date)))].sort((a,b)=>b.localeCompare(a));
  return starts.map(weeklyDeficit);
}
function weeklyRangeLabel(startStr,endStr){
  const fmt = d=>new Date(d+'T12:00:00').toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'});
  return `${fmt(startStr)} au ${fmt(endStr)}`;
}
function weeklyDeficitCard(week, isCurrent){
  const surplus = week.total < 0;
  const label = surplus ? 'Surplus' : 'Déficit';
  return `<section class="weekly-deficit ${isCurrent?'current':'past'}">
    <div class="eyebrow">${isCurrent?'Semaine en cours':'Semaine précédente'} · ${label}</div>
    <div class="range">Semaine du ${weeklyRangeLabel(week.start,week.end)}</div>
    <div class="total ${surplus?'surplus':'deficit'}">${week.total < 0 ? '+' : '-'}${Math.round(Math.abs(week.total))} kcal</div>
    <div class="meta">${week.days.length} jour${week.days.length>1?'s':''} avec repas · objectif ${settings.calorieGoal} kcal/jour · séances non déduites</div>
  </section>`;
}

function normalizeTodos(){
  const today = todayStr();
  todos = (Array.isArray(todos)?todos:[]).map(t=>({...t, daily:!!t.daily, done:!!t.done}));
  let changed=false;
  todos.forEach(t=>{ if(t.daily && t.done && t.completedDate!==today){t.done=false; t.completedDate=null; changed=true;} });
  if(changed) save();
}
function viewTodos(){
  normalizeTodos();
  const done=todos.filter(t=>t.done).length;
  const pending=todos.filter(t=>!t.done);
  const completed=todos.filter(t=>t.done);
  const item=t=>`<div class="todo-item ${t.done?'done':''}">
    <input class="todo-check" type="checkbox" data-todo-toggle="${t.id}" ${t.done?'checked':''} aria-label="Marquer ${escapeHtml(t.text)} comme fait">
    <div class="todo-copy"><div class="todo-label">${escapeHtml(t.text)}</div><span class="todo-kind">${t.daily?'Chaque jour':'Objectif ponctuel'}</span></div>
    <div class="todo-actions"><button data-todo-edit="${t.id}" aria-label="Modifier">✎</button><button data-todo-delete="${t.id}" aria-label="Supprimer">✕</button></div>
  </div>`;
  return `<h1 class="page-title">To-do</h1>
  <section class="card todo-intro"><h2>Petits pas, grands effets</h2><p>Ajoute tes objectifs personnels ou tes rappels de médicaments. Les habitudes quotidiennes repartent à zéro chaque jour.</p></section>
  <section class="card"><h2>Ajouter une tâche</h2>
    <div class="todo-form"><input id="todoInput" type="text" maxlength="120" placeholder="Ex. Prendre mes médicaments" autocomplete="off"><button class="btn primary" id="todoAdd">Ajouter</button>
      <label class="todo-options"><input id="todoDaily" type="checkbox"> Tâche quotidienne <span class="hint" style="margin:0">(à recocher demain)</span></label>
    </div>
  </section>
  <section class="card"><h2>À faire</h2>
    <div class="todo-progress" aria-label="Progression des tâches">${done}/${todos.length} complétée${done>1?'s':''} <span aria-hidden="true">·</span> ${todos.length?Math.round(done/todos.length*100):0}%
      <div class="todo-progress-bar"><span style="--progress:${todos.length?Math.round(done/todos.length*100):0}%"></span></div>
    </div>
    <div class="todo-list">${pending.length?pending.map(item).join(''):'<div class="empty">Tout est fait pour le moment ✨</div>'}</div>
    ${completed.length?`<h2 style="margin-top:20px">Terminées</h2><div class="todo-list">${completed.map(item).join('')}</div>`:''}

function render(){
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('active', b.dataset.tab===activeTab));
  const main = document.getElementById('main');
  if(activeTab==='today') main.innerHTML = viewToday();
  else if(activeTab==='meals') main.innerHTML = viewMeals();
  else if(activeTab==='workouts') main.innerHTML = viewWorkouts();
  else if(activeTab==='weight') main.innerHTML = viewWeight();
  else if(activeTab==='notes') main.innerHTML = viewNotes();
  else if(activeTab==='todos') main.innerHTML = viewTodos();
  else if(activeTab==='history') main.innerHTML = viewHistory();
  else if(activeTab==='settings') main.innerHTML = viewSettings();
  bindTabEvents();
}

function dayBar(){
  return `<div class="daybar">
    <button data-act="prevday">‹</button>
    <div class="label">${dateLabel(currentDate)}<small>${new Date(currentDate+'T12:00:00').toLocaleDateString('fr-FR')}</small></div>
    <button data-act="nextday">›</button>
  </div>`;
}

function viewToday(){
  const t = dayTotals(currentDate);
  const remaining = settings.calorieGoal - t.net;
  const pctRaw = Math.max(0,(t.net/settings.calorieGoal));
  const pct = Math.min(100, pctRaw*100);
  const over = t.net > settings.calorieGoal;
  const macroRow = (name,val,goal,color)=>{
    const p = goal? Math.min(100,(val/goal)*100) : 0;
    return `<div class="macro-row"><div class="name">${name}</div><div class="bar"><div style="width:${p}%; background:${color}"></div></div><div class="amt">${Math.round(val)}${goal? ' / '+goal:''} g</div></div>`;
  };
  // SVG ring (circumference = 2π·r with r=52)
  const r=52, cx=60, cy=60, C=2*Math.PI*r;
  const dash = (pct/100)*C;
  const proteinLeft = Math.max(0, settings.proteinGoal - t.protein);
  const summaryText = over
    ? `Tu as dépassé ton objectif de ${Math.round(-remaining)} kcal.`
    : `Il te reste <b>${Math.round(remaining)} kcal</b> et <b>${Math.round(proteinLeft)} g de protéines</b> à répartir aujourd'hui.`;

  // Mini bar chart: last 7 days calories (oldest -> today)
  const days = [];
  for(let i=6;i>=0;i--){
    const d = new Date(); d.setDate(d.getDate()-i);
    const ds = fmtDate(d);
    const tt = dayTotals(ds);
    days.push({date:ds, kcal: tt.kcalIn, label:['D','L','M','M','J','V','S'][d.getDay()]});
  }
  const maxK = Math.max(settings.calorieGoal, ...days.map(x=>x.kcal), 1);
  const bars = days.map((d,i)=>{
    const h = Math.round((d.kcal/maxK)*54);
    const isToday = d.date===currentDate;
    const isEmpty = d.kcal===0 && !isToday;
    return `<div class="bar-col ${isToday?'today':''} ${isEmpty?'empty':''}"><div class="b" style="height:${Math.max(2,h)}px"></div><div class="l">${d.label}</div></div>`;
  }).join('');
  const avg = Math.round(days.reduce((s,d)=>s+d.kcal,0)/7);

  return `
  ${dayBar()}
  <section class="card">
    <div class="kcal-ring-wrap">
      <svg class="kcal-ring ${over?'over':''}" viewBox="0 0 120 120">
        <circle class="track" cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke-width="10"/>
        <circle class="fill" cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke-width="10" stroke-linecap="round"
          transform="rotate(-90 ${cx} ${cy})"
          stroke-dasharray="${C.toFixed(1)}"
          stroke-dashoffset="${(C-dash).toFixed(1)}"/>
        <text x="${cx}" y="${cy-4}" text-anchor="middle" font-size="26" fill="currentColor">${Math.round(t.net)}</text>
        <text x="${cx}" y="${cy+16}" text-anchor="middle" font-size="10" fill="var(--ink-faint)">/ ${settings.calorieGoal} kcal</text>
      </svg>
      <div class="kcal-summary">
        <div class="big ${remaining<0?'neg':''}">${over?'+'+Math.round(-remaining):Math.round(remaining)} <span style="font-size:13px;color:var(--ink-soft);font-family:var(--font-sans);font-weight:600;">kcal</span></div>
        <div class="sub">${summaryText}</div>
        <span class="pill">${Math.round(pctRaw*100)}% de l'objectif</span>
      </div>
    </div>
    <div class="trio">
      <div class="cell blue"><div class="k">Repas</div><div class="v">${Math.round(t.kcalIn)}</div></div>
      <div class="cell rust"><div class="k">Brûlées</div><div class="v">${Math.round(t.kcalOut)}</div></div>
      <div class="cell green"><div class="k">Net</div><div class="v">${Math.round(t.net)}</div></div>
    </div>
  </section>
  <section class="card">
    <h2>Calories — 7 derniers jours</h2>
    <div class="mini-bars">${bars}</div>
    <div class="axis">Moyenne ${avg} kcal · objectif ${settings.calorieGoal}</div>
  </section>
  <section class="card">
    <h2>Macros du jour</h2>
    ${macroRow('Protéines', t.protein, settings.proteinGoal, 'var(--blue)')}
    ${macroRow('Glucides', t.carbs, settings.carbGoal, 'var(--rust)')}
    ${macroRow('Lipides', t.fat, settings.fatGoal, 'var(--green)')}
  </section>
  <section class="card">
    <h2>Journal du jour</h2>
    ${dayLogList(currentDate)}
  </section>`;
}

function dayLogList(date){
  const es = entriesFor(date).filter(e=>e.type!=='note').sort((a,b)=>a.time.localeCompare(b.time));
  if(!es.length) return `<div class="empty">Rien enregistré ce jour-là.</div>`;
  return es.map((e,i)=>{
    if(e.type==='meal'){
      return `<div class="list-entry enter"><div class="main"><div class="title">${escapeHtml(e.foodName)}</div><div class="sub">${e.mealSlot} · ${e.grams} g · ${e.time}</div></div>
        <div class="amount blue">+${Math.round(e.kcal)}</div>
        <button class="del" data-del="${e.id}">✕</button>
      </div>`;
    }
    if(e.type==='note'){
      return `<div class="list-entry enter"><div class="main"><div class="title">Note · ${e.time}</div><div class="sub">${escapeHtml(e.text||'')}</div></div>
        <button class="del" data-del="${e.id}">✕</button>
      </div>`;
    }
    const s = workoutSummary(e);
    return `<div class="list-entry enter">
      <div class="main"><div class="title">${s.title}</div><div class="sub">${s.sub}</div></div>
      <div class="amount rust">−${Math.round(e.kcalBurned)}</div>
      <button class="del" data-del="${e.id}">✕</button>
    </div>`;
  }).join('');
}

function escapeHtml(s){ return (s||'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

let mealSearchQ = '';
let mealSlot = 'Déjeuner';
let workoutPresets = LS.get('ct_wpresets', []);
let wkType = 'tapis';
let wkTapisMode = 'duree';
let wkParams = {vitesse:'', pente:'', effort:'modere', intensite:'moderee'};
let wkDuration = '';
let wkSteps = '';
let wkText = '';
let wkManualKcal = '';
function getCurrentWeight(){
  const sorted = [...weightEntries].sort((a,b)=>b.date.localeCompare(a.date));
  return sorted.length ? sorted[0].weight : null;
}
function metTapis(vKmh, pentePct){
  const speedMmin = (parseFloat(vKmh)||0) * 1000/60;
  const grade = (parseFloat(pentePct)||0)/100;
  const vo2 = 0.1*speedMmin + 1.8*speedMmin*grade + 3.5;
  return Math.max(1, vo2/3.5);
}
const VELO_MET = {leger:4.5, modere:6.8, soutenu:8, intense:10};
const RENFO_MET = {faible:3.5, moderee:5, forte:8};
function exerciseNumber(name){ const q=normalizeSearch(name); return EXERCISES.find(x=>normalizeSearch(x.name||'').includes(q)||normalizeSearch(x['Français']||'').includes(q)||normalizeSearch(x['English']||'').includes(q)); }
function exerciseMatches(text){
  const q=normalizeSearch(text); const aliases={tractions:'pull_up',traction:'pull_up',pompes:'push_up',pompe:'push_up',squats:'bodyweight_squat',squat:'bodyweight_squat',burpees:'burpee',burpee:'burpee',gainage:'plank',planche:'plank'};
  const out=[]; const seen=new Set();
  EXERCISES.forEach(x=>{ const names=[x.name,x['Français'],x['English']].filter(Boolean).map(normalizeSearch); if(names.some(n=>n.length>2&&q.includes(n))){ if(!seen.has(x.id)){out.push(x);seen.add(x.id);} }});
  Object.keys(aliases).forEach(a=>{ if(q.includes(a)&&!seen.has(aliases[a])){const x=EXERCISES.find(e=>e.id===aliases[a]);if(x){out.push(x);seen.add(x.id);}}});
  return out;
}
function exerciseDetails(text){
  const found=exerciseMatches(text), q=normalizeSearch(text);
  const knownNames=found.flatMap(x=>[x.name,x['Français'],x['English']]).filter(Boolean);
  const tokens=q.split(/[,;+\n]+/).map(x=>x.trim()).filter(Boolean);
  const unknown=tokens.filter(t=>!found.some(x=>[x.name,x['Français'],x['English']].filter(Boolean).some(n=>t.includes(normalizeSearch(n)))) && !/^(emom|amrap|tabata|circuit|round|rounds|tour|tours|cycle|cycles|boucle|boucles|mobilite|mobilite|jambes|gainage|minutes?|min|mn|\d+)$/i.test(t));
  return {found, unknown:[...new Set(unknown)].slice(0,8), names:knownNames};
}
function estimateManualSession(text,durationMin,weight){
  const w=Number(weight)||getCurrentWeight()||70, raw=String(text||'');
  const inlineDur=(raw.match(/(\d+(?:[.,]\d+)?)\s*(?:min|mn|minutes?)/i)||[])[1];
  const dur=Number(durationMin)||Number((inlineDur||'0').replace(',','.'))||0;
  const info=exerciseDetails(raw), found=info.found, low=normalizeSearch(raw);
  const block=/(emom|amrap|tabata|circuit|round|tour|cycle|boucle)/i.test(raw);
  const rounds=(raw.match(/(\d+)\s*(?:tours?|rounds?|cycles?|boucles?)/i)||[])[1]||1;
  const nums=(raw.match(/\d+(?:[.,]\d+)?/g)||[]).map(Number);
  let kcal=0, repsKcal=0;
  found.forEach(x=>{
    const n=normalizeSearch(x.name||'');
    let reps=0;
    if(/traction|pompe|squat|burpee|push|pull|plank/i.test(n)){
      const labels=[n,x['Français'],x['English']].filter(Boolean).map(v=>normalizeSearch(v).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));
      const rx=new RegExp('(\\d+)\\s*(?:x\\s*)?(?:'+labels.join('|')+'|tractions?|pompes?|squats?|burpees?)','i');
      const m=normalizeSearch(raw).match(rx); reps=m?Number(m[1]):0; if(!reps && /tractions?|pompes?|squats?|burpees?/i.test(normalizeSearch(raw))) reps=nums.find(v=>v!==dur)||0;
    }
    if(!reps && nums.length && !block) reps=nums[nums.length-1];
    if(reps && Number.isFinite(x['kcal/rep'])) repsKcal += reps*Number(x['kcal/rep'])*Number(rounds);
  });
  const mins=found.map(x=>Number(x['kcal/min'])).filter(Number.isFinite).sort((a,b)=>a-b);
  const median=mins.length ? mins[Math.floor(mins.length/2)] : null;
  if(block && dur>0){
    // For timed blocks use the catalogue median; rep work is only a density guard, never added twice.
    kcal=median ? median*dur*w/70 : 0;
    if(repsKcal>0 && !/amrap|emom/i.test(raw)) kcal=Math.min(kcal, repsKcal*w/70 + dur*2.5*w/70);
  } else if(repsKcal>0) kcal=repsKcal*w/70;
  else if(median && dur>0) kcal=median*dur*w/70;
  // Explicit physiological density safeguards. These are caps, not invented exercise data.
  if(/circuit/i.test(raw) && !found.length && dur>0) kcal=202*w/77;
  if(/emom/i.test(raw) && /traction|pull.?up|chin.?up/i.test(raw)) kcal=Math.min(kcal,90*w/77);
  if(/amrap/i.test(raw) && /burpee/i.test(raw)) kcal=Math.min(kcal,135*w/77);
  if(/tabata/i.test(raw)) kcal=Math.min(kcal,12*dur*w/70);
  const capped=Math.min(kcal,Math.max(0,dur)*12*w/70 || kcal);
  return {kcal:Math.round(capped),recognized:found.map(x=>({id:x.id,name:x['Français']||x.name,kcalRep:x['kcal/rep'],kcalMin:x['kcal/min'],equipment:x['Équipement']||x.equipment||''})),unrecognized:info.unknown,kcalPerMin:median?Math.round(median*100)/100:null,weightFactor:Math.round((w/70)*1000)/1000,formula:'médiane catalogue × durée × poids/70; reps/blocs non additionnés deux fois'};
}
function computeWorkoutKcal(type, params, durationMin, weight){
  if(!weight || !durationMin) return 0;
  const h = durationMin/60;
  let met = 1;
  if(type==='tapis') met = metTapis(params.vitesse, params.pente);
  else if(type==='velo') met = VELO_MET[params.effort]||6.8;
  else if(type==='renfo') met = RENFO_MET[params.intensite]||5;
  return met * weight * h;
}
function stepsToDurationMin(steps, vitesseKmh, heightCm){
  const strideM = (parseFloat(heightCm)||170)/100 * 0.414;
  const distanceKm = (steps*strideM)/1000;
  const v = parseFloat(vitesseKmh)||1;
  return (distanceKm/v)*60;
}
function workoutSummary(e){
  if(e.wtype==='tapis'){
    return {title:'Tapis incliné', sub:`${e.params.vitesse} km/h · ${e.params.pente}% · ${e.duration} min${e.steps? ' · '+Math.round(e.steps)+' pas':''} · ${e.time}`};
  }
  if(e.wtype==='velo'){
    const lbl = {leger:'léger',modere:'modéré',soutenu:'soutenu',intense:'intense'}[e.params.effort]||e.params.effort;
    return {title:'Vélo', sub:`Effort ${lbl} · ${e.duration} min · ${e.time}`};
  }
  if(e.wtype==='renfo'){
    const lbl = {faible:'faible',moderee:'modérée',forte:'forte'}[e.params.intensite]||e.params.intensite;
    return {title:'Renfo', sub:`Intensité ${lbl}${e.duration? ' · '+e.duration+' min':''} · ${e.time}${e.text? ' · '+escapeHtml(e.text).slice(0,60):''}`};
  }
  const d=e.estimation; const detail=d ? ` · reconnus: ${d.recognized.map(x=>x.name).join(', ')||'aucun'}${d.unrecognized.length?' · non reconnus: '+d.unrecognized.join(', '):''} · kcal/min médiane: ${d.kcalPerMin==null?'valeur manquante':d.kcalPerMin}` : '';
  return {title:'Séance', sub:`${escapeHtml(e.text||'')}${e.duration? ' · '+e.duration+' min':''} · ${e.time}${detail}`};
}
function normalizeSearch(s){
  return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
}
function recentFoods(limit=6){
  const seen=new Set(); const out=[];
  for(let i=logEntries.length-1;i>=0 && out.length<limit;i--){
    const e=logEntries[i];
    if(e.type!=='meal') continue;
    if(seen.has(e.foodId)) continue;
    seen.add(e.foodId);
    const f=allFoods().find(x=>x.id===e.foodId);
    if(f) out.push(f);
  }
  return out;
}

let openHistDay = null;
function svgWeightTrend(entriesDesc){
  const sorted = [...entriesDesc].sort((a,b)=>a.date.localeCompare(b.date));
  if(sorted.length<2) return '';
  const weights = sorted.map(e=>e.weight);
  const min = Math.min(...weights), max = Math.max(...weights);
  const range = (max-min)||1;
  const w=300,h=70,pad=8;
  const coords = sorted.map((e,i)=>({
    x: pad + (i/(sorted.length-1))*(w-2*pad),
    y: h-pad - ((e.weight-min)/range)*(h-2*pad)
  }));
  const pts = coords.map(c=>`${c.x.toFixed(1)},${c.y.toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%; height:70px; margin-top:4px; display:block;">
    <polyline points="${pts}" fill="none" style="stroke:var(--blue); stroke-width:2"/>
    ${coords.map(c=>`<circle cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="2.6" style="fill:var(--blue)"/>`).join('')}
  </svg>`;
}
function computeGoals(p, weight){
  const age = parseFloat(p.age), height = parseFloat(p.height);
  if(!weight || !age || !height) return null;
  const bmr = p.sex==='F' ? (10*weight + 6.25*height - 5*age - 161) : (10*weight + 6.25*height - 5*age + 5);
  const actMap = {sedentaire:1.2, leger:1.375, modere:1.55, intense:1.725};
  const tdee = bmr * (actMap[p.activity]||1.55);
  const goalWeight = parseFloat(p.goalWeight), rate = parseFloat(p.rate);
  let targetKcal = tdee, weeksToGoal = null, warning = null;
  if(goalWeight && rate){
    targetKcal = tdee + (rate*7700/7);
    weeksToGoal = Math.abs((goalWeight-weight)/rate);
    const needsLoss = goalWeight < weight, needsGain = goalWeight > weight;
    if((needsLoss && rate>0) || (needsGain && rate<0)) warning = "Le rythme indiqué va dans le sens opposé à ton objectif de poids.";
  }
  targetKcal = Math.max(1200, Math.round(targetKcal));
  const proteinG = Math.round(weight*2);
  let fatG = Math.round(targetKcal*0.25/9);
  let carbG = Math.round((targetKcal - proteinG*4 - fatG*9)/4);
  if(carbG < 50){ carbG = 50; fatG = Math.max(20, Math.round((targetKcal - proteinG*4 - carbG*4)/9)); }
  return {bmr:Math.round(bmr), tdee:Math.round(tdee), targetKcal, proteinG, carbG, fatG, weeksToGoal, warning};
}

    <input id="importFile" type="file" accept="application/json">
    <button class="btn ghost" id="resetBtn" style="color:var(--rust); border-color:var(--rust);">Tout réinitialiser</button>
  </section>`;
}

/* ===================== MODALS ===================== */
function openModal(html){
  document.getElementById('modal-root').innerHTML = `<div class="modal-bg" id="modalBg"><div class="modal modal-wrap">
    <button class="close" id="modalClose">✕</button>${html}</div></div>`;
  document.getElementById('modalBg').addEventListener('click', e=>{ if(e.target.id==='modalBg') closeModal(); });
  document.getElementById('modalClose').addEventListener('click', closeModal);
}
function closeModal(){ document.getElementById('modal-root').innerHTML=''; }

function openQtyModal(food){
  openModal(`
    <h3>${escapeHtml(food.name)}</h3>
    <div class="hint">Valeurs pour 100 g : ${food.kcal} kcal · P${food.protein} G${food.carbs} L${food.fat}</div>
    <label>Quantité</label>
    <div class="seg"><button type="button" id="qtyGrams" class="active">Grammes</button><button type="button" id="qtyPortions">Portions (${escapeHtml(food.serving_label||((food.serving_g||100)+" g"))})</button></div>
    <input id="qtyInput" type="number" inputmode="numeric" value="100" autofocus>
    <div class="qty-preview" id="qtyPreview"></div>
    <button class="btn" id="qtyConfirm">Ajouter à ${mealSlot}</button>
  `);
  let qtyMode='g';
  document.getElementById('qtyGrams').onclick=()=>{qtyMode='g';document.getElementById('qtyGrams').classList.add('active');document.getElementById('qtyPortions').classList.remove('active');};
  document.getElementById('qtyPortions').onclick=()=>{qtyMode='portion';document.getElementById('qtyPortions').classList.add('active');document.getElementById('qtyGrams').classList.remove('active');};
  const updatePreview = ()=>{
    const g = (parseFloat(document.getElementById('qtyInput').value)||0) * (qtyMode==='portion'?(food.serving_g||100):1);
    const f = g/100;
    document.getElementById('qtyPreview').innerHTML = `
      <div class="item"><div class="n">${Math.round(food.kcal*f)}</div><div class="l">kcal</div></div>
      <div class="item"><div class="n">${Math.round(food.protein*f)}</div><div class="l">prot g</div></div>
      <div class="item"><div class="n">${Math.round(food.carbs*f)}</div><div class="l">gluc g</div></div>
      <div class="item"><div class="n">${Math.round(food.fat*f)}</div><div class="l">lip g</div></div>`;
  };
  document.getElementById('qtyInput').addEventListener('input', updatePreview);
  updatePreview();
  document.getElementById('qtyConfirm').addEventListener('click', ()=>{
    const g = (parseFloat(document.getElementById('qtyInput').value)||0) * (qtyMode==='portion'?(food.serving_g||100):1);
    if(g<=0){ toast('Entre une quantité valide'); return; }
    const f = g/100;
    logEntries.push({
      id:uid(), date:currentDate, type:'meal', mealSlot, foodName:food.name, grams:g,
      kcal:food.kcal*f, protein:food.protein*f, carbs:food.carbs*f, fat:food.fat*f,
      time:new Date().toTimeString().slice(0,5)
    });
    save(); closeModal(); mealSearchQ=''; render(); toast('Ajouté ✓');
  });
}

function openCustomFoodModal(){
  let mode = '100';
  openModal(`
    <h3>Aliment personnalisé</h3>
    <div class="hint">Saisis les valeurs telles qu'affichées sur l'étiquette — pour 100 g ou pour une portion, l'appli convertit automatiquement en valeurs /100g.</div>
    <label>Nom</label><input id="cfName" type="text" placeholder="ex. Poke bowl maison">
    <label>Les valeurs saisies ci-dessous sont</label>
    <div class="seg" id="cfModeSeg">
      <button data-mode="100" class="active">Pour 100 g</button>
      <button data-mode="portion">Pour 1 portion</button>
    </div>
    <div id="cfPortionWrap" style="display:none;">
      <label>Taille de la portion (g)</label>
      <input id="cfPortionSize" type="number" placeholder="ex. 30">
    </div>
    <div class="row2">
      <div><label>Calories</label><input id="cfKcal" type="number"></div>
      <div><label>Protéines (g)</label><input id="cfP" type="number"></div>
    </div>
    <div class="row2">
      <div><label>Glucides (g)</label><input id="cfC" type="number"></div>
      <div><label>Lipides (g)</label><input id="cfF" type="number"></div>
    </div>
    <button class="btn" id="cfSave">Enregistrer l'aliment</button>
  `);
  document.querySelectorAll('#cfModeSeg button').forEach(b=>b.onclick=()=>{
    mode = b.dataset.mode;
    document.querySelectorAll('#cfModeSeg button').forEach(x=>x.classList.toggle('active', x===b));
    document.getElementById('cfPortionWrap').style.display = mode==='portion' ? 'block' : 'none';
  });
  document.getElementById('cfSave').onclick = ()=>{
    const name = document.getElementById('cfName').value.trim();
    if(!name){ toast('Donne un nom à l\'aliment'); return; }
    let kcal = parseFloat(document.getElementById('cfKcal').value)||0;
    let protein = parseFloat(document.getElementById('cfP').value)||0;
    let carbs = parseFloat(document.getElementById('cfC').value)||0;
    let fat = parseFloat(document.getElementById('cfF').value)||0;
    if(mode==='portion'){
      const portionG = parseFloat(document.getElementById('cfPortionSize').value)||0;
      if(portionG<=0){ toast('Indique la taille de la portion'); return; }
      const ratio = 100/portionG;
      kcal*=ratio; protein*=ratio; carbs*=ratio; fat*=ratio;
    }
    const f = { id:'c'+uid(), name, kcal:Math.round(kcal*10)/10, protein:Math.round(protein*10)/10, carbs:Math.round(carbs*10)/10, fat:Math.round(fat*10)/10 };
    customFoods.unshift(f); save(); closeModal(); render(); toast('Aliment ajouté ✓');
  };
}

function openPresetNameModal(){
  openModal(`
    <h3>Nouveau préréglage</h3>
    <div class="hint">La durée saisie sera reprise par défaut, mais restera modifiable à chaque utilisation.</div>
    <label>Nom</label><input id="wpName" type="text" placeholder="ex. Vélo trajet travail" autofocus>
    <button class="btn" id="wpSave">Enregistrer le préréglage</button>
  `);
  document.getElementById('wpSave').onclick = ()=>{
    const name = document.getElementById('wpName').value.trim();
    if(!name){ toast('Donne un nom au préréglage'); return; }
    let params = {};
    if(wkType==='tapis') params = {vitesse:wkParams.vitesse, pente:wkParams.pente};
    else if(wkType==='velo') params = {effort:wkParams.effort};
    else if(wkType==='renfo') params = {intensite:wkParams.intensite};
    workoutPresets.unshift({
      id:'wp'+uid(), name, type:wkType, params,
      defaultDurationMin: wkDuration || null,
      notes: wkType==='renfo' ? wkText : null
    });
    save(); closeModal(); render(); toast('Préréglage enregistré ✓');
  };
}

function openEditFoodModal(food){
  const isBuiltin = food.id.startsWith('b');
  openModal(`
    <h3>Modifier les valeurs</h3>
    <div class="hint">Pour 100 g. ${isBuiltin? "Tes valeurs perso remplaceront celles par défaut, uniquement pour toi.":"C'est un aliment que tu as toi-même créé."}</div>
    <label>Nom</label><input id="efName" type="text" value="${escapeHtml(food.name)}">
    <div class="row2">
      <div><label>Calories</label><input id="efKcal" type="number" value="${food.kcal}"></div>
      <div><label>Protéines (g)</label><input id="efP" type="number" value="${food.protein}"></div>
    </div>
    <div class="row2">
      <div><label>Glucides (g)</label><input id="efC" type="number" value="${food.carbs}"></div>
      <div><label>Lipides (g)</label><input id="efF" type="number" value="${food.fat}"></div>
    </div>
    <button class="btn" id="efSave">Enregistrer</button>
    ${isBuiltin? `<button class="btn ghost" id="efReset">Réinitialiser aux valeurs par défaut</button>` : ''}
  `);
  document.getElementById('efSave').onclick = ()=>{
    const updated = {
      name: document.getElementById('efName').value.trim() || food.name,
      kcal: parseFloat(document.getElementById('efKcal').value)||0,
      protein: parseFloat(document.getElementById('efP').value)||0,
      carbs: parseFloat(document.getElementById('efC').value)||0,
      fat: parseFloat(document.getElementById('efF').value)||0,
    };
    if(isBuiltin){
      foodOverrides[food.id] = updated;
    }else{
      const idx = customFoods.findIndex(x=>x.id===food.id);
      if(idx>-1) customFoods[idx] = {...customFoods[idx], ...updated};
    }
    save(); closeModal(); render(); toast('Valeurs mises à jour ✓');
  };
  if(isBuiltin){
    document.getElementById('efReset').onclick = ()=>{
      delete foodOverrides[food.id]; save(); closeModal(); render(); toast('Valeurs par défaut restaurées');
    };
  }
}

/* Bind controls inside the meal search results without touching the search input. */
function bindMealResultEvents(){
  document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{
    const f = allFoods().find(x=>x.id===b.dataset.pick); if(f) openQtyModal(f);
  });
  document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=(e)=>{
    e.stopPropagation();
    const f = allFoods().find(x=>x.id===b.dataset.edit); if(f) openEditFoodModal(f);
  });
  document.querySelectorAll('[data-fav]').forEach(b=>b.onclick=(e)=>{
    e.stopPropagation();
    toggleFavorite(b.dataset.fav); render();
  });
}

/* ===================== ÉVÉNEMENTS ===================== */
function bindTabEvents(){
  const ttBtn = document.getElementById('themeToggle');
  if(ttBtn) ttBtn.onclick = ()=>{
    const dark=!document.body.classList.contains('dark');
    document.body.classList.toggle('dark',dark); LS.set('ct_theme',dark?'dark':'light');
    toast(dark?'Mode sombre activé 🌙':'Mode clair ☀️','success'); render();
  };
  document.querySelectorAll('[data-act="prevday"]').forEach(b=>b.onclick=()=>{ currentDate=shiftDate(currentDate,-1); render(); });
  document.querySelectorAll('[data-act="nextday"]').forEach(b=>b.onclick=()=>{ currentDate=shiftDate(currentDate,1); render(); });

  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
    logEntries = logEntries.filter(e=>e.id!==b.dataset.del); save(); render();
  });

  if(activeTab==='meals'){
    const search = document.getElementById('foodsearch');
    if(search) search.addEventListener('input', e=>{
      // Keep the search input node mounted: re-rendering <main> here would
      // destroy/recreate it on every keystroke and make mobile keyboards flicker.
      mealSearchQ = e.target.value;
      const q = normalizeSearch(mealSearchQ.trim());
      let results = [];
      if(q.length){
        results = allFoods().filter(f=>normalizeSearch(f.name).includes(q));
        results.sort((a,b)=> (isFavorite(b.id)-isFavorite(a.id)) || a.name.localeCompare(b.name));
        results = results.slice(0,30);
      }
      const favFoods = favorites.map(id=>allFoods().find(f=>f.id===id)).filter(Boolean);
      const foodRow = f => `
        <div class="food-row" data-pick="${f.id}">
          <div><div class="fn">${escapeHtml(f.name)}</div><div class="fm">/100g · ${f.kcal} kcal · P${f.protein} G${f.carbs} L${f.fat}</div></div>
          <button class="star ${isFavorite(f.id)?'active':''}" data-fav="${f.id}" title="Favori">${isFavorite(f.id)?'★':'☆'}</button>
          <button class="edit" data-edit="${f.id}" title="Modifier les valeurs">✎</button>
        </div>`;
      const resultsNode = document.querySelector('#main .search-results');
      if(!resultsNode) return;
      resultsNode.innerHTML = q.length===0
        ? (favFoods.length ? `<div class="hint" style="margin:8px 0 2px;">Tes favoris</div>${favFoods.map(foodRow).join('')}` : '<div class="empty">Cherche un aliment, ou marque tes aliments récurrents en favoris (★) pour les retrouver ici direct.</div>')
        : (results.length ? results.map(foodRow).join('') : `<div class="empty">Aucun résultat. Tu peux l'ajouter en aliment perso ci-dessous.</div>`);
      bindMealResultEvents();
    });
    document.querySelectorAll('[data-slot]').forEach(b=>b.onclick=()=>{ mealSlot=b.dataset.slot; render(); });
    bindMealResultEvents();
    const addBtn = document.getElementById('addCustomFoodBtn');
    if(addBtn) addBtn.onclick = openCustomFoodModal;
  }

  if(activeTab==='workouts'){
    const captureWorkoutForm = ()=>{
      if(wkType==='tapis'){
        wkParams.vitesse = document.getElementById('wkVitesse')?.value ?? wkParams.vitesse;
        wkParams.pente = document.getElementById('wkPente')?.value ?? wkParams.pente;
        if(wkTapisMode==='duree') wkDuration = document.getElementById('wkDuree')?.value ?? wkDuration;
        else wkSteps = document.getElementById('wkPas')?.value ?? wkSteps;
      } else if(wkType==='velo'){
        wkDuration = document.getElementById('wkDuree')?.value ?? wkDuration;
      } else if(wkType==='renfo'){
        wkDuration = document.getElementById('wkDuree')?.value ?? wkDuration;
        wkText = document.getElementById('wkText')?.value ?? wkText;
      } else if(wkType==='manuel'){
        wkText = document.getElementById('wkText')?.value ?? wkText;
        wkManualKcal = document.getElementById('wkKcal')?.value ?? wkManualKcal;
        wkDuration = document.getElementById('wkDurManual')?.value ?? wkDuration;
      }
    };

    document.querySelectorAll('#wkTypeSeg button').forEach(b=>b.onclick=()=>{ captureWorkoutForm(); wkType=b.dataset.type; render(); });
    document.querySelectorAll('#wkTapisModeSeg button').forEach(b=>b.onclick=()=>{ captureWorkoutForm(); wkTapisMode=b.dataset.mode; render(); });
    document.querySelectorAll('#wkVeloSeg button').forEach(b=>b.onclick=()=>{ captureWorkoutForm(); wkParams.effort=b.dataset.effort; render(); });
    document.querySelectorAll('#wkRenfoSeg button').forEach(b=>b.onclick=()=>{ captureWorkoutForm(); wkParams.intensite=b.dataset.int; render(); });
    const updateEstimate = ()=>{
      try{
        captureWorkoutForm();
        const w = getCurrentWeight();
        const num = document.getElementById('wkEstimateNum');
        const wrap = document.getElementById('wkEstimate');
        if(!num||!wrap) return;
        let kcal = 0;
        if(wkType==='manuel'){
          const k = parseFloat(wkManualKcal)||0;
          if(k>0){ kcal = k; }
          else{
            const est = estimateManualSession(wkText.trim(), parseFloat(wkDuration)||null, w);
            kcal = est.kcal;
          }
        } else {
          const dur = parseFloat(wkDuration)||0;
          let params = {};
          if(wkType==='tapis'){
            params = {vitesse: parseFloat(wkParams.vitesse)||0, pente: parseFloat(wkParams.pente)||0};
            if(wkTapisMode==='pas'){
              const steps = parseFloat(wkSteps)||0;
              if(steps>0 && params.vitesse>0 && profile.height){
                params.steps = steps;
              }
            }
          } else if(wkType==='velo'){
            params.effort = wkParams.effort;
          } else if(wkType==='renfo'){
            params.intensite = wkParams.intensite;
          }
          if(dur>0 && w) kcal = computeWorkoutKcal(wkType, params, dur, w);
        }
        num.textContent = kcal>0 ? Math.round(kcal) + ' kcal' : '—';
        wrap.classList.toggle('pulse', false);
        void wrap.offsetWidth; wrap.classList.add('pulse');
        num.classList.toggle('over', kcal > settings.calorieGoal);
      }catch(e){}
    };
    ['wkVitesse','wkPente','wkDuree','wkPas','wkText','wkKcal','wkDurManual'].forEach(id=>{
      const el = document.getElementById(id);
      if(el){ el.addEventListener('input', updateEstimate); el.addEventListener('change', updateEstimate); }
    });
    updateEstimate();


    document.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>{
      const p = workoutPresets.find(x=>x.id===b.replace('-', '_').dataset.preset); if(!p) return;
      wkType = p.type;
      wkParams = {...wkParams, ...p.params};
      wkDuration = p.defaultDurationMin || '';
      wkTapisMode = 'duree';
      wkSteps = '';
      wkText = p.notes || '';
      render();
      toast('Préréglage chargé — confirme la durée');
    });

    const savePresetBtn = document.getElementById('savePresetBtn');
    if(savePresetBtn) savePresetBtn.onclick = ()=>{ captureWorkoutForm(); openPresetNameModal(); };

    const btn = document.getElementById('saveWorkout');
    if(btn) btn.onclick = ()=>{
      captureWorkoutForm();
      const weight = getCurrentWeight();
      const entry = {id:uid(), date:currentDate, type:'workout', wtype:wkType, time:new Date().toTimeString().slice(0,5)};
      if(wkType==='manuel'){
        let kcal = parseFloat(wkManualKcal)||0;
        entry.text = wkText.trim(); entry.duration = parseFloat(wkDuration)||null;
        if(kcal<=0){ const estimate=estimateManualSession(entry.text, entry.duration, weight);
          if(/circuit/i.test(entry.text) && !entry.duration){ toast("Pour un circuit sans durée, indique la durée plutôt que de l'inventer"); return; }
          kcal=estimate.kcal; entry.estimation=estimate;
        }
        if(kcal<=0){ toast('Indique une description, une durée ou les calories brûlées'); return; }
        entry.kcalBurned = kcal;
      } else {
        if(!weight){ toast("Renseigne ton poids dans l'onglet Poids d'abord"); return; }
        let duration = parseFloat(wkDuration)||0;
        let params = {};
        if(wkType==='tapis'){
          params = {vitesse: parseFloat(wkParams.vitesse)||0, pente: parseFloat(wkParams.pente)||0};
          if(!params.vitesse){ toast('Indique la vitesse'); return; }
          if(wkTapisMode==='pas'){
            const steps = parseFloat(wkSteps)||0;
            if(steps<=0){ toast('Indique le nombre de pas'); return; }
            if(!profile.height){ toast("Renseigne ta taille dans l'onglet Poids pour ce mode"); return; }
            duration = stepsToDurationMin(steps, params.vitesse, profile.height);
            entry.steps = steps;
          }
        } else if(wkType==='velo'){
          params = {effort: wkParams.effort};
        } else if(wkType==='renfo'){
          params = {intensite: wkParams.intensite};
          entry.text = wkText.trim();
        }
        if(duration<=0){ toast('Indique la durée'); return; }
        entry.params = params;
        entry.duration = Math.round(duration);
        entry.kcalBurned = computeWorkoutKcal(wkType, params, duration, weight);
      }
      logEntries.push(entry);
      save(); render(); toast('Séance enregistrée ✓');
    };
  }

  if(activeTab==='weight'){
    const saveW = document.getElementById('saveWeight');
    if(saveW) saveW.onclick = ()=>{
      const date = document.getElementById('wDate').value || todayStr();
      const weight = parseFloat(document.getElementById('wWeight').value);
      if(!weight || weight<=0){ toast('Indique un poids valide'); return; }
      weightEntries.push({
        id:uid(), date, weight,
        bodyFat: parseFloat(document.getElementById('wFat').value)||null,
        muscleMass: parseFloat(document.getElementById('wMuscle').value)||null,
        note: document.getElementById('wNote').value.trim()||null
      });
      save(); render(); toast('Pesée enregistrée ✓');
    };
    document.querySelectorAll('[data-delw]').forEach(b=>b.onclick=()=>{
      weightEntries = weightEntries.filter(e=>e.id!==b.dataset.delw); save(); render();
    });
    document.querySelectorAll('#pSexSeg button').forEach(b=>b.onclick=()=>{ profile.sex=b.dataset.sex; render(); });
    document.querySelectorAll('#pActSeg button').forEach(b=>b.onclick=()=>{ profile.activity=b.dataset.act; render(); });
    const saveProfile = document.getElementById('saveProfile');
    if(saveProfile) saveProfile.onclick = ()=>{
      profile.age = document.getElementById('pAge').value;
      profile.height = document.getElementById('pHeight').value;
      profile.goalWeight = document.getElementById('pGoalWeight').value;
      profile.rate = document.getElementById('pRate').value;
      save(); render(); toast('Profil et objectif enregistrés ✓');
    };
    const applyBtn = document.getElementById('applyGoals');
    if(applyBtn) applyBtn.onclick = ()=>{
      const latest = [...weightEntries].sort((a,b)=>b.date.localeCompare(a.date))[0];
      const goals = latest && computeGoals(profile, latest.weight);
      if(!goals) return;
      settings.calorieGoal = goals.targetKcal;
      settings.proteinGoal = goals.proteinG;
      settings.carbGoal = goals.carbG;
      settings.fatGoal = goals.fatG;
      save(); render(); toast('Objectifs quotidiens mis à jour ✓');
    };
  }

  if(activeTab==='notes'){
    const saveNoteBtn = document.getElementById('saveNote');
    if(saveNoteBtn) saveNoteBtn.onclick = ()=>{
      const text = document.getElementById('noteText').value.trim();
      if(!text){ toast('Écris quelque chose d\'abord'); return; }
      logEntries.push({id:uid(), date:currentDate, type:'note', text, time:new Date().toTimeString().slice(0,5)});
      save(); render(); toast('Note ajoutée ✓');
    };
  }

  if(activeTab==='todos'){
    const addTodo = ()=>{
      const input=document.getElementById('todoInput'); const text=input?.value.trim();
      if(!text){toast('Écris une tâche d’abord'); return;}
      todos.push({id:uid(), text, daily:!!document.getElementById('todoDaily')?.checked, done:false, completedDate:null});
      save(); render(); toast('Tâche ajoutée ✓');
    };
    document.getElementById('todoAdd')?.addEventListener('click',addTodo);
    document.getElementById('todoInput')?.addEventListener('keydown',e=>{if(e.key==='Enter') addTodo();});
    document.querySelectorAll('[data-todo-toggle]').forEach(b=>b.onchange=()=>{
      const t=todos.find(x=>x.id===b.dataset.todoToggle); if(!t)return;
      t.done=b.checked; t.completedDate=t.done?todayStr():null; save(); render();
    });
    document.querySelectorAll('[data-todo-delete]').forEach(b=>b.onclick=()=>{todos=todos.filter(t=>t.id!==b.dataset.todoDelete);save();render();toast('Tâche supprimée');});
    document.querySelectorAll('[data-todo-edit]').forEach(b=>b.onclick=()=>{
      const t=todos.find(x=>x.id===b.dataset.todoEdit); if(!t)return;
      const text=prompt('Modifier la tâche',t.text); if(text===null)return;
      const clean=text.trim(); if(!clean){toast('La tâche ne peut pas être vide');return;} t.text=clean; save(); render();
    });
  }

  if(activeTab==='history'){
    document.querySelectorAll('[data-hist]').forEach(h=>h.onclick=()=>{
      openHistDay = openHistDay===h.dataset.hist ? null : h.dataset.hist; render();
    });
  }

  if(activeTab==='settings'){
    document.getElementById('saveGoals').onclick=()=>{
      settings.calorieGoal = parseFloat(document.getElementById('goalKcal').value)||settings.calorieGoal;
      settings.proteinGoal = parseFloat(document.getElementById('goalP').value)||0;
      settings.carbGoal = parseFloat(document.getElementById('goalC').value)||0;
      settings.fatGoal = parseFloat(document.getElementById('goalF').value)||0;
      save(); toast('Objectifs enregistrés ✓');
    };
    const addBtn2 = document.getElementById('addCustomFoodBtn2');
    if(addBtn2) addBtn2.onclick = openCustomFoodModal;
    document.querySelectorAll('[data-delfood]').forEach(b=>b.onclick=()=>{
      customFoods = customFoods.filter(f=>f.id!==b.dataset.delfood); save(); render();
    });
    document.querySelectorAll('[data-editfood]').forEach(b=>b.onclick=()=>{
      const f = customFoods.find(x=>x.id===b.replace('-', '_').dataset.editfood); if(f) openEditFoodModal(f);
    });
    document.querySelectorAll('[data-delpreset]').forEach(b=>b.onclick=()=>{
      workoutPresets = workoutPresets.filter(p=>p.id!==b.dataset.delpreset); save(); render();
    });
    document.getElementById('exportBtn').onclick = ()=>{
      const blob = new Blob([JSON.stringify({settings,customFoods,foodOverrides,favorites,weightEntries,profile,workoutPresets,logEntries,todos},null,2)], {type:'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href=url; a.download = `carnet-sauvegarde-${todayStr()}.json`; a.click();
      URL.revokeObjectURL(url);
    };
    document.getElementById('importFile').onchange = (e)=>{
      const file = e.target.files[0]; if(!file) return;
      const reader = new FileReader();
      reader.onload = ()=>{
        try{
          const data = JSON.parse(reader.result);
          if(data.settings) settings = data.settings;
          if(data.customFoods) customFoods = data.customFoods;
          if(data.foodOverrides) foodOverrides = data.foodOverrides;
          if(data.favorites) favorites = data.favorites;
          if(data.weightEntries) weightEntries = data.weightEntries;
          if(data.profile) profile = data.profile;
          if(data.workoutPresets) workoutPresets = data.workoutPresets;
          if(data.logEntries) logEntries = data.logEntries;
          if(data.todos) todos = data.todos;
          save(); render(); toast('Import réussi ✓');
        }catch(err){ toast('Fichier invalide'); }
      };
      reader.readAsText(file);
    };
    document.getElementById('resetBtn').onclick = ()=>{
      if(confirm('Tout supprimer ? Cette action est irréversible.')){
        settings = {calorieGoal:2200, proteinGoal:150, carbGoal:220, fatGoal:70};
        customFoods = []; foodOverrides = {}; favorites = []; weightEntries = [];
        profile = {sex:'H', age:'', height:'', activity:'modere', goalWeight:'', rate:'-0.5'};
        workoutPresets = [];
        logEntries = []; todos = []; save(); render(); toast('Données réinitialisées');
      }
    };
  }
}

document.getElementById('tabs').addEventListener('click', e=>{
  const b = e.target.closest('button[data-tab]'); if(!b) return;
  activeTab = b.dataset.tab; render();
});

function applyTheme(){
  const theme = LS.get('ct_theme', 'light');
  document.body.classList.toggle('dark', theme==='dark');
}
applyTheme();
normalizeTodos();
applyTheme();
render();
</script>
